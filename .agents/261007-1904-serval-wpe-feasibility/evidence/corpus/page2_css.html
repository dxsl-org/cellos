<!DOCTYPE html><html><head><title>CSS Flex</title><style>
@font-face { font-family: 'CustomFont'; src: local('Arial'); }
body { font-family: 'CustomFont'; display: flex; align-items: center; justify-content: center; height: 100vh; background: #eee; }
.box { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
</style></head><body><div class="box"><div>Item 1</div><div>Item 2</div></div></body></html>
