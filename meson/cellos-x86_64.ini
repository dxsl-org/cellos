# Cellos x86_64 Tier-2 hard-float C/C++ (runtime plan D-R3, rule H1).
# Compile only: Rust owns final cell linking. The compiler entry carries
# CELLOS_C_TARGET itself, so the caller's environment cannot select the no-SSE
# x86 row or another architecture. tools/ must be on PATH, as for riscv64.
[binaries]
c = ['env', 'CELLOS_C_TARGET=x86_64-unknown-none-sse2', 'cellos-cc']
ar = 'ar'
strip = 'strip'

[properties]
needs_exe_wrapper = true

[host_machine]
system = 'cellos'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[built-in options]
c_args = ['-std=c11']
