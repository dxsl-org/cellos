# Vendored Sunset core (see PROVENANCE). The upstream workspace, demos, async/std/sftp
# crates, the RSA/ECDSA/ML-KEM options and the dev-dependencies are removed; workspace
# dependency entries are inlined with the upstream versions.
[package]
name = "sunset"
version = "0.6.0"
edition = "2024"
description = "A SSH library suitable for embedded and larger programs"
repository = "https://github.com/mkj/sunset"
license = "0BSD"
rust-version = "1.95"

[dependencies]
sunset-sshwire-derive = { version = "0.3", path = "sshwire-derive" }

snafu = { version = "0.9", default-features = false, features = ["rust_1_81"] }
log = "0.4"
heapless = "0.9"
ascii = { version = "1.0", default-features = false }
# Cellos patch 0001: no `getrandom`; the embedding program installs the entropy source.
spin = { version = "0.9", default-features = false, features = ["once"] }
rand_core = { version = "0.10", default-features = false }

ctr = { version = "0.10", features = ["zeroize"] }
aes = { version = "0.9", features = ["zeroize"] }
chacha20 = { version = "0.9", features = ["zeroize"] }
sha2 = { version = "0.11", default-features = false }
hmac = "0.13"
poly1305 = "0.9"
digest = "0.11"
zeroize = { version = "1", default-features = false, features = ["derive"] }
cipher = { version = "0.5", features = ["zeroize"] }
subtle = { version = "2.6", default-features = false }
ed25519-dalek = { version = "3.0", default-features = false, features = ["zeroize", "rand_core"] }
x25519-dalek = { version = "3.0", default-features = false, features = ["zeroize"] }
ssh-key = { version = "0.7.0-rc.11", default-features = false, optional = true }

[features]
default = []
alloc = ["ssh-key?/alloc"]
openssh-key = ["ssh-key"]
larger = []

# Upstream features whose dependencies are not vendored; their cfg blocks stay
# compiled out.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(fuzzing)',
    'cfg(feature, values("std", "arbitrary", "backtrace", "rsa", "_ecdsa", "ecdsa256", "mlkem", "embedded-io"))',
] }
