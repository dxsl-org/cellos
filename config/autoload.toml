# Applications start after the configured required services are ready.
version = 1

[[cells]]
name = "fb-console"
path = "/bin/fb-console"
after = ["compositor"]
restart = "never"

[[cells]]
name = "desktop"
path = "/bin/desktop"
after = ["compositor"]
restart = "never"

[[cells]]
name = "hypervisor"
path = "/bin/hypervisor"
service_id = 14
restart = "always"

# Hotswap test image only (packaging feature `hotswap-demo`): the demo provider runs as a
# supervised service, never as a shell background job. Not restarted: the supervisor
# replaces it with /bin/hotswap-demo-v2.
[[cells]]
name = "hotswap-demo"
path = "/bin/hotswap-demo-v1"
restart = "never"

[[cells]]
name = "cellbox"
path = "/bin/cellbox"
args = ["sh"]
restart = "on-failure"
