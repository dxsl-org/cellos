# Applications start after the configured required services are ready.
version = 1

[[cells]]
name = "fb-console"
path = "/bin/fb-console"
after = ["compositor"]
restart = "never"

[[cells]]
name = "desktop"
path = "/bin/desktop"
after = ["compositor"]
restart = "never"

[[cells]]
name = "hypervisor"
path = "/bin/hypervisor"
service_id = 14
restart = "always"

# Hotswap test image only (packaging feature `hotswap-demo`): the demo provider runs as a
# supervised service, never as a shell background job. Not restarted: the supervisor
# replaces it with /bin/hotswap-demo-v2.
[[cells]]
name = "hotswap-demo"
path = "/bin/hotswap-demo-v1"
restart = "never"

# Phase 09B evidence image only (packaging feature `recovery-demo`): the provider-owned
# state authority, which spawns, fences and restarts its own worker. Not restarted:
# its RAM state is the committed state, so losing it is RecoveryFailed, never a cold
# start. service_id 31242 (0x7A0A) is the cell-private fixture id the worker and the
# evidence client resolve; init registers it.
[[cells]]
name = "recovery-authority"
path = "/bin/recovery-authority"
restart = "never"
service_id = 31242

[[cells]]
name = "cellbox"
path = "/bin/cellbox"
args = ["sh"]
restart = "on-failure"
