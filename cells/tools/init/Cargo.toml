[package]
name = "app-init"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
api = { path = "../../../libs/api", version = "0.1.0" }
ostd = { path = "../../../libs/ostd", version = "0.2.0" }
ocel-service-proto = { path = "../../../libs/ocel-service-proto", version = "0.1.0" }
ocel-pdf-proto = { path = "../../../libs/ocel-pdf-proto", version = "0.1.0" }
dom-arena = { path = "../../../libs/dom-arena", version = "0.1.0" }
cellos-boot-config = { path = "../../../libs/boot-config", version = "0.1.0" }

[features]
default = []
# When enabled, init spawns /bin/vfs-test after the main service stack is up.
# Only used in CI test-hooks kernel builds — never in production.
test-hooks = []
# When enabled, init launches the phase-02 Tier-2 entry fixtures
# (/bin/tier2-smoke, /bin/tier2-exploit) first in the optional-service list.
# Opted into only by scripts/build-aarch64-test-hooks-ci.sh: that image is the
# one whose boot ends before its shell becomes interactive, so the fixtures have
# to be scheduled from the boot order rather than typed at a prompt.
tier2-entry = []
# When enabled, init launches the phase-02 slice B cross-tier exchange
# (/bin/tier2-rpc-provider = Tier-2 private-root provider, then
# /bin/tier2-rpc-driver = Tier-1 driver, handed the provider's tid through the
# argv stash). Opted into only by scripts/build-x86_64-domain-test-ci.sh: those
# two cells are packaged only in that image.
tier2-rpc-entry = []
# When enabled, init launches the phase-03 step-5 Tier-2 grant pair
# (/bin/silo = owner, /bin/net-broker = receiver) from the boot order and drives
# its five receiver generations to their deliberate store faults, so the pair runs
# end-to-end on an image whose shell never becomes interactive. Opted into only by
# scripts/build-aarch64-test-hooks-ci.sh. The two paths are reviewed init-launch
# edges whose real services are not built into that image; enabling this together
# with development-silo-provider or c2c-broker is a compile error.
tier2-grant-pair = []
# ── Options ─────────────────────────────────────────────────────────────────
# Features select packaged artifacts and platform/test fixtures. Ordinary boot
# choices are generated into /etc/cellos/services.toml and autoload.toml, not
# compiled into init. They do not change admission policy or launch ceilings.
#
# input: keyboard/mouse event routing (HID sources, VirtIO input).
input = []
# ui: the display path -- compositor, fb-console, and KMS where the board has a
# real display driver rather than VirtIO.
ui = []
# ai: the Spec 24 inference service plus the config service it reads.
ai = []
# supervisor: the hotswap supervisor cell.
supervisor = []
# usb-host: the USB host driver cell (`/bin/dwc2-usb`, which also brings up the
# LAN9514 Ethernet on a Pi). Off for a bring-up image whose only console is the
# serial header: the kernel keeps its bring-up drivers, the image keeps no USB.
usb-host = []
# tier3: the guest-hosting cell is part of this image (Tier 3 apps). Without it
# the image cannot run a Linux guest at all and `hv` fails closed with "cell
# missing" -- the option to pick when a machine must be safer than it is capable.
tier3 = []
# tier3-autostart: preload the VM at boot so the first Tier-3 app starts fast.
# Requires `tier3`.
tier3-autostart = []
# Preload the Tier-3 VM at boot. Cellos prioritises Tier 1/2 and otherwise lands
# on a shell prompt with the guest idle (`hv` starts it); servers that want a
# Tier-3 app to start fast enable this instead.
hv-autostart = []
# Include the hostile-only supervisor control Cell (implies `supervisor`).
hostile-backend-recovery = ["api/hostile-backend-recovery"]
# Package the development/reference Silo service with exact self-ready registration.
development-silo-provider = []
# Package the fail-closed C2C broker only in images provisioning its cluster key.
c2c-broker = []
# Select the RPi3 platform's fixed storage bootstrap and generated display profile.
board-rpi3 = []

[build-dependencies]
cell-build = { path = "../../../libs/cell-build", version = "0.2.0" }
