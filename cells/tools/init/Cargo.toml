[package]
name = "app-init"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
api = { path = "../../../libs/api", version = "0.1.0" }
ostd = { path = "../../../libs/ostd", version = "0.2.0" }

[features]
default = []
# When enabled, init spawns /bin/vfs-test after the main service stack is up.
# Only used in CI test-hooks kernel builds — never in production.
test-hooks = []
# When enabled, init brings up only VFS + shell + hypervisor — the Tier-3 VM
# boot profile used by the hypervisor filesystem images and smoke lanes.
hypervisor-min = []
# Admit the development/reference AArch64 Silo service into the supervised table.
development-silo-provider = []
# Spawn the fail-closed C2C broker only in images that provision its cluster key.
c2c-broker = []
# Select the VideoCore mailbox display driver during RPi3 boot.
board-rpi3 = []

[build-dependencies]
cell-build = { path = "../../../libs/cell-build", version = "0.2.0" }
