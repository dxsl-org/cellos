[package]
name = "driver-bcm-display"
version = "0.1.0"
edition = "2021"
license.workspace = true

[features]
default = ["runtime"]
runtime = ["dep:ostd", "dep:hal-soc-bcm27xx"]
[dependencies]
types           = { path = "../../../libs/types", version = "0.1.0" }
api             = { path = "../../../libs/api", version = "0.1.0" }
ostd            = { path = "../../../libs/ostd", version = "0.2.0", optional = true }
hal-soc-bcm27xx = { path = "../../../hal/soc/bcm27xx", version = "0.2.0", optional = true }

[[bin]]
name = "driver-bcm-display"
path = "src/main.rs"

[lib]
name = "driver_bcm_display"
path = "src/lib.rs"

[build-dependencies]
cell-build = { path = "../../../libs/cell-build", version = "0.2.0" }
