[package]
name = "driver-imu-mpu6050"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
types           = { path = "../../../libs/types", version = "0.1.0" }
api             = { path = "../../../libs/api", version = "0.1.0" }
ostd            = { path = "../../../libs/ostd", version = "0.2.0" }
driver-i2c-bcm  = { path = "../i2c-bcm", version = "0.1.0" }
hal-i2c         = { path = "../../../hal/traits/i2c", version = "0.1.0" }

[[bin]]
name = "driver-imu-mpu6050"
path = "src/main.rs"

[lib]
name = "driver_imu_mpu6050"
path = "src/lib.rs"

[build-dependencies]
cell-build = { path = "../../../libs/cell-build", version = "0.2.0" }
