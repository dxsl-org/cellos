[package]
name = "driver-dwc2-usb"
version = "0.1.0"
edition = "2021"
license.workspace = true

[features]
default = ["runtime"]
runtime = ["dep:ostd", "dep:hal-soc-bcm27xx"]
# Diagnostic image: one rate-limited `[dwc2-loop]` line per ~2 s with the turn
# count and the worst/last turn cost. The driver shares its loop with HID, and a
# long turn is what keeps it out of `Recv` while a client is trying to reach it.
loop-trace = []
# Diagnostic image: PHY loopback self-test at bring-up. Prints whether a frame the
# chip transmits comes back through its own receive path, which separates the LAN
# side (cable/PHY/peer) from the receive configuration inside Cellos.
loopback-diag = []

[dependencies]
types           = { path = "../../../libs/types", version = "0.1.0" }
api             = { path = "../../../libs/api", version = "0.1.0" }
driver-hid      = { path = "../hid", version = "0.1.0" }
ostd            = { path = "../../../libs/ostd", version = "0.2.0", optional = true }
hal-soc-bcm27xx = { path = "../../../hal/soc/bcm27xx", version = "0.2.0", optional = true }

[[bin]]
name = "driver-dwc2-usb"
path = "src/main.rs"


[[bin]]
name = "driver-lan9514"
path = "src/lan_worker.rs"

[lib]
name = "driver_dwc2_usb"
path = "src/lib.rs"

[build-dependencies]
cell-build = { path = "../../../libs/cell-build", version = "0.2.0" }
