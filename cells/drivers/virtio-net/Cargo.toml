[package]
name    = "driver-virtio-net"
version = "0.1.0"
edition = "2021"
license.workspace = true

[[bin]]
name = "driver-virtio-net"
path = "src/main.rs"

[dependencies]
types          = { path = "../../../libs/types", version = "0.1.0" }
abi            = { path = "../../../libs/abi", version = "0.1.0" }
wire           = { path = "../../../libs/wire", version = "0.1.0" }
ostd           = { path = "../../../libs/ostd", version = "0.2.0" }
virtio-drivers = "0.7"

[target.'cfg(target_arch = "x86_64")'.dependencies]
virtio-pci-transport = { path = "../../../libs/virtio-pci-transport", version = "0.1.0" }

[build-dependencies]
cell-build = { path = "../../../libs/cell-build", version = "0.2.0" }
