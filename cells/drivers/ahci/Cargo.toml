[package]
name    = "driver-ahci"
version = "0.1.0"
edition = "2021"
license.workspace = true

[[bin]]
name = "driver-ahci"
path = "src/main.rs"

[features]
# Phase 08A block-outcome witness only (`src/fault_inject.rs`); never enabled
# by a production image profile.
fault-inject = []

[dependencies]
types = { path = "../../../libs/types", version = "0.1.0" }
api   = { path = "../../../libs/api", version = "0.1.0" }
ostd  = { path = "../../../libs/ostd", version = "0.2.0" }

[build-dependencies]
cell-build = { path = "../../../libs/cell-build", version = "0.2.0" }
