[package]
name = "tetris"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Tetris — canonical native Rust implementation for Cellos"

[[bin]]
name = "tetris"
path = "src/main.rs"

[dependencies]
abi  = { path = "../../../libs/abi", version = "0.1.0" }
wire = { path = "../../../libs/wire", version = "0.1.0" }
ostd = { path = "../../../libs/ostd", version = "0.2.0" }

[build-dependencies]
cell-build = { path = "../../../libs/cell-build", version = "0.2.0" }
