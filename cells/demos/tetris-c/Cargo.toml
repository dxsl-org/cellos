[package]
name = "tetris-c"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Tetris-C port via Banaxi-Tech/Tetris-OS — runs on the Cellos compositor with keyboard input"

[[bin]]
name = "tetris-c"
path = "src/main.rs"

[dependencies]
abi  = { path = "../../../libs/abi", version = "0.1.0" }
wire = { path = "../../../libs/wire", version = "0.1.0" }
posix-shim = { path = "../../../libs/posix-shim", version = "0.1.0" }
ostd = { path = "../../../libs/ostd", version = "0.2.0" }
port-platform = { path = "../../../libs/port-platform", version = "0.1.0" }

[build-dependencies]
cc         = "1.0"
cell-build = { path = "../../../libs/cell-build", version = "0.2.0" }
