# Standalone workspace root — NOT a member of the main ViCell workspace.
# This binary targets aarch64-unknown-none-softfloat (bare-metal Stage-2 guest).
# The development Silo service build script performs the locked build and
# deterministic objcopy packaging.
[workspace]

[package]
name = "silo-guest"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"

[[bin]]
name = "silo-guest"
path = "src/main.rs"

[dependencies]
# P-256 pure-Rust, no_std; the guest exposes only purpose-bound ECDSA.
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
# SHA-2 pure-Rust, no_std.
sha2 = { version = "0.10", default-features = false }

[profile.release]
opt-level    = "z"
lto          = "fat"
codegen-units = 1
panic        = "abort"
strip        = "symbols"

[profile.dev]
panic = "abort"
