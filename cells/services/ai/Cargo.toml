[package]
name = "service-ai"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Unified AI inference service Cell (Spec 24 §2) — serves /bin/ai over typed IPC"

[dependencies]
ostd = { path = "../../../libs/ostd", version = "0.2.0" }
api = { path = "../../../libs/api", version = "0.1.0" }
ai-proto = { path = "../../../libs/ai-proto", version = "0.1.0" }
ai-engine = { path = "../../../libs/ai-engine", version = "0.1.0" }

[features]
default = []
# Size the cell arena for a ~25 MB checkpoint (llama2.c `stories15M`). The default arena serves the
# small checkpoints; this exists so one deployment can opt into the larger footprint.
large-arena = []

[build-dependencies]
cell-build = { path = "../../../libs/cell-build", version = "0.2.0" }
