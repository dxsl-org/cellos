[package]
name = "service-kms"
version = "0.1.0"
edition = "2021"
license.workspace = true

[features]
default = []
hardware-relay-provider = []
development-silo-provider = []
development-stm32-authority = []
vf2-root-stream = []
fixture-provider = []
test-hooks = []
raw-relay-provider = []
k1-fallback = []
# Opt-in development SSH key custody (opcodes 15-24, volatile, DEV_POSTURE). Off by
# default; build.rs refuses it under CELLOS_PRODUCTION and lib.rs excludes it from
# hardware-relay-provider.
ssh-dev-custody = ["dep:bcrypt-pbkdf", "dep:blowfish", "dep:aes", "dep:ctr", "dep:zeroize", "dep:ed25519-dalek"]
# Opt-in T1 on top of it (DEV_POSTURE, x86_64 bare metal only): the passphrase-wrapped
# identity is persisted to /srv/cellos/kms/ssh-{a,b}.bin through the VFS. No rollback or
# crash-durability claim. Implies ssh-dev-custody, so every guard on that feature (the
# hardware-relay-provider exclusion and the CELLOS_PRODUCTION refusal) applies here too.
ssh-dev-persist = ["ssh-dev-custody"]

[[bin]]
name = "service-kms"
path = "src/main.rs"
test = false

[dependencies]
api = { path = "../../../libs/api", version = "0.1.0" }
types = { path = "../../../libs/types", version = "0.1.0" }
blake2 = { version = "0.10.6", default-features = false }
constant_time_eq = { version = "0.4.2", default-features = false }
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
sha2 = { version = "0.10", default-features = false }
ostd = { path = "../../../libs/ostd", version = "0.2.0" }
bcrypt-pbkdf = { version = "0.11", default-features = false, features = ["zeroize"], optional = true }
blowfish = { version = "0.10", default-features = false, features = ["zeroize", "bcrypt"], optional = true }
aes = { version = "0.9", default-features = false, features = ["zeroize"], optional = true }
ctr = { version = "0.10", default-features = false, features = ["zeroize"], optional = true }
zeroize = { version = "1", default-features = false, optional = true }
ed25519-dalek = { version = "3.0", default-features = false, features = ["zeroize"], optional = true }

[build-dependencies]
cell-build = { path = "../../../libs/cell-build", version = "0.2.0" }
