[package]
name = "service-input"
version = "0.2.0"
edition = "2021"
license.workspace = true

[dependencies]
types          = { path = "../../../libs/types", version = "0.1.0" }
abi            = { path = "../../../libs/abi", version = "0.1.0" }
wire           = { path = "../../../libs/wire", version = "0.1.0" }
ostd           = { path = "../../../libs/ostd", version = "0.2.0" }
virtio-drivers = "0.7"

[[bin]]
name = "service-input"
path = "src/main.rs"

[build-dependencies]
cell-build = { path = "../../../libs/cell-build", version = "0.2.0" }

[features]
default = ["virtio-mmio"]
virtio-mmio = []
board-rpi3 = []
board-rpi4 = []
