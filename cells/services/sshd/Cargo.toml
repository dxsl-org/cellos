[package]
name = "service-sshd"
version = "0.1.0"
edition = "2021"
license.workspace = true

[[bin]]
name = "service-sshd"
path = "src/main.rs"

[dependencies]
ostd = { path = "../../../libs/ostd", version = "0.2.0" }
api = { path = "../../../libs/api", version = "0.1.0" }
types = { path = "../../../libs/types", version = "0.1.0" }
serde = { version = "1", default-features = false, features = ["derive"] }
ed25519-compact = { version = "2", default-features = false }
x25519-dalek = { version = "2.0", default-features = false, features = ["static_secrets"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
chacha20 = { version = "0.9", default-features = false }
poly1305 = { version = "0.8", default-features = false }
sha2 = { version = "0.10", default-features = false }

[build-dependencies]
cell-build = { path = "../../../libs/cell-build", version = "0.2.0" }
