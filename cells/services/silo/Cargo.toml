[package]
name = "service-silo"
version = "0.1.0"
edition = "2021"
license.workspace = true

[features]
default = []
development-silo-provider = []

[lib]
path = "src/lib.rs"

[[bin]]
name = "silo"
path = "src/main.rs"
test = false

[dependencies]
types  = { path = "../../../libs/types", version = "0.1.0" }
api    = { path = "../../../libs/api", version = "0.1.0" }
ostd   = { path = "../../../libs/ostd", version = "0.2.0" }
sha2 = { version = "0.10", default-features = false }

[build-dependencies]
cell-build = { path = "../../../libs/cell-build", version = "0.2.0" }
sha2 = { version = "0.10.8", default-features = false }
