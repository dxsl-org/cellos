[package]
name = "service-net"
version = "0.1.0"
edition = "2021"
license.workspace = true

# ── TLS build flavors (mutually exclusive) ────────────────────────────────────
# tls-roots-embedded : single pinned CA via pki::CertVerifier (G1 default, small)
# tls-roots-full     : rustls-webpki multi-root (G2 server/PC, deferred to P04)
# tls-insecure       : UnsecureProvider — no cert check, dev/lab only
# qemu-dev-https    : public Mozilla roots, authenticated host time, QEMU DEV only
#
# CA selector (mutually exclusive, one must be active in embedded builds):
# tls-ca-private     : fleet's own ECDSA P-256 CA (default; replace private.der)
# tls-ca-amazon      : Amazon Root CA 3 (ECDSA P-256, +21 KB)
# tls-ca-letsencrypt : ISRG Root X2 (ECDSA P-384, +100 KB)
# tls-ca-rsa         : RSA CA opt-in (heavy, +135 KB, documented cost)
[features]
default = ["tls-roots-embedded", "tls-ca-private"]

hypervisor-bridge = []
ipc-wake-oracle = []
# Diagnostic image: one rate-limited `[net-loop]` line per ~2 s with turns,
# messages received, L2 request counts and driver commands/deadlines. Shows
# whether the service is looping and where its time goes.
loop-trace = []
# Flavors
tls-roots-embedded = []
tls-roots-full     = []   # deps wired in P04
tls-insecure       = []
# Explicit alternative to the fleet flavor; build with --no-default-features.
# All certificate crypto is pure Rust, including RSA, for no_std guest targets.
qemu-dev-https = [
    "dep:webpki",
    "dep:pki-types",
    "dep:webpki-roots",
    "dep:p256",
    "dep:p384",
    "dep:rsa",
    "dep:ed25519-dalek",
]
verified-tls       = []
raw-relay          = []
k1-fallback        = []

# CA selectors — map to embedded-tls crypto features per spike-00 size table
tls-ca-private      = ["embedded-tls/rustpki"]   # ECDSA P-256, +21 KB (reuses handshake crates)
tls-ca-amazon       = ["embedded-tls/rustpki"]   # Amazon Root CA 3, ECDSA P-256, +21 KB
tls-ca-letsencrypt  = ["embedded-tls/p384"]      # ISRG Root X2, ECDSA P-384, +100 KB
tls-ca-rsa          = ["embedded-tls/rsa"]       # RSA heavyweight opt-in, +135 KB

[dependencies]
types  = { path = "../../../libs/types", version = "0.1.0" }
sha2   = { version = "0.10", default-features = false }
heapless = { version = "0.8", default-features = false }
api    = { path = "../../../libs/api", version = "0.1.0" }
ostd   = { path = "../../../libs/ostd", version = "0.2.0" }
embedded-tls      = { version = "0.19", default-features = false, features = ["alloc"] }
embedded-io       = { version = "0.7",  default-features = false }
embedded-io-async = { version = "0.7",  default-features = false }
rand_core         = { version = "0.6",  default-features = false }
rand_chacha       = { version = "0.3",  default-features = false }
# Versions pin the verifier API and the Mozilla/CCADB trust-store snapshot.
# No ring/aws-lc: their platform backends are not available in bare-metal cells.
webpki = { package = "rustls-webpki", version = "=0.103.7", default-features = false, features = ["alloc"], optional = true }
pki-types = { package = "rustls-pki-types", version = "=1.13.0", default-features = false, features = ["alloc"], optional = true }
webpki-roots = { version = "=1.0.3", default-features = false, optional = true }
p256 = { version = "0.13", default-features = false, features = ["ecdsa"], optional = true }
p384 = { version = "0.13", default-features = false, features = ["ecdsa"], optional = true }
rsa = { version = "0.9", default-features = false, features = ["sha2"], optional = true }
ed25519-dalek = { version = "2.2", default-features = false, optional = true }
smoltcp = { version = "0.11", default-features = false, features = [
    "alloc",
    "socket-tcp",
    "socket-udp",
    "socket-dhcpv4",
    "socket-icmp",
    # Name resolution for NetRequest::Resolve — the service's only DNS client.
    "socket-dns",
    "proto-ipv4",
    "proto-dhcpv4",
    "proto-igmp",
    "proto-dns",
] }

[[bin]]
name = "service-net"
path = "src/main.rs"

[build-dependencies]
cell-build = { path = "../../../libs/cell-build", version = "0.2.0" }
