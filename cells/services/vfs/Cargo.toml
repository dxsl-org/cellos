[package]
name = "service-vfs"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
types = { path = "../../../libs/types", version = "0.1.0" }
api = { path = "../../../libs/api", version = "0.1.0" }
ostd = { path = "../../../libs/ostd", version = "0.2.0" }
driver-disk = { path = "../../drivers/disk", version = "0.1.0" }
# `lfn` is REQUIRED: mkfat32.py stores cell names with a long-filename entry
# (lowercase basenames like `nc` cannot be represented by an uppercase-only 8.3
# short name, so the real name lives in the LFN). Without `lfn`, fatfs sees only
# the mangled 8.3 form (`NC~1`) and a lookup of `/bin/nc` from the disk cell-store
# fails — which silently made the cell-store unreadable for interactive spawns.
fatfs = { git = "https://github.com/rafalh/rust-fatfs", version = "0.4.0", default-features = false, features = ["alloc", "lfn"] }

cellos-fs = { path = "../../../libs/cellos-fs", version = "0.1.0" }

[features]
default = []
# Shrinks the per-cell quota to a tiny limit so the vfs-test cell can exercise
# quota enforcement (Err 2) without writing the full 32 MB production limit.
# Enabled ONLY for the integration-test kernel build — never in production.
test-hooks = []
# Injects a run-scoped benchmark-oracle K1 into RamFS. The build script requires
# CELLOS_C2C_ORACLE_K1_FILE to name exactly 32 bytes whenever this is enabled.
c2c-oracle-k1-fixture = []

[[bin]]
name = "service-vfs"
path = "src/main.rs"

[build-dependencies]
cell-build = { path = "../../../libs/cell-build", version = "0.2.0" }
