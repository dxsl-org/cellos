[package]
name = "ocel-pdf"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Owner-scoped native MuPDF PDF raster service for RV64"

[dependencies]
api = { path = "../../../libs/api", version = "0.1.0" }
ostd = { path = "../../../libs/ostd", version = "0.2.0" }
ocel-pdf-proto = { path = "../../../libs/ocel-pdf-proto", version = "0.1.0" }
postcard = { version = "1.0", default-features = false, features = ["alloc"] }

[build-dependencies]
cc = "1.0"
cell-build = { path = "../../../libs/cell-build", version = "0.2.0" }
