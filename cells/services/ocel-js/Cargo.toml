[package]
name = "ocel-js"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Ocel Tier 2 JavaScript Service Cell for CellOS"

[dependencies]
api = { path = "../../../libs/api", version = "0.1.0" }
ostd = { path = "../../../libs/ostd", version = "0.2.0" }
dom-arena = { path = "../../../libs/dom-arena", version = "0.1.0" }
postcard = { version = "1.0", default-features = false, features = ["alloc"] }
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
