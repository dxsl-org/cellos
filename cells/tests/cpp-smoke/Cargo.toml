[package]
name = "app-cpp-smoke"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "cpp-freestanding runtime profile smoke test (language subset + shim allocator + VFS read)"

[[bin]]
name = "cpp-smoke"
path = "src/main.rs"

[dependencies]
api  = { path = "../../../libs/api", version = "0.1.0" }
ostd = { path = "../../../libs/ostd", version = "0.2.0" }

[build-dependencies]
cc         = "1.0"
cell-build = { path = "../../../libs/cell-build", version = "0.2.0" }
