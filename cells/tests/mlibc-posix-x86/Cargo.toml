[package]
name = "app-mlibc-posix-x86"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "x86_64 Tier-2 witness for mlibc posix: threads, futex, timed waits, TLS, errno, dl_iterate_phdr (runtime plan R3a)"

[[bin]]
name = "mlibc-posix-x86"
path = "src/main.rs"

[dependencies]
# `mlibc` suppresses the Tier-A posix exports so mlibc's libc.a can link.
abi        = { path = "../../../libs/abi", version = "0.1.0" }
posix-shim = { path = "../../../libs/posix-shim", version = "0.1.0", features = ["mlibc"] }
ostd       = { path = "../../../libs/ostd", version = "0.2.0" }
mlibc-shim = { path = "../../../libs/mlibc-shim", version = "0.1.0" }

[build-dependencies]
cc = "1.0"
cell-build = { path = "../../../libs/cell-build", version = "0.2.0" }
