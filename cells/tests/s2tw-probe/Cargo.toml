[package]
name = "app-s2tw-probe"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Private Phase04 S2-T/S2-W fixture: reports whether task/memory telemetry and VFS mutation are refused on the path it was launched from"

[[bin]]
name = "s2tw-probe"
path = "src/main.rs"

[dependencies]
api = { path = "../../../libs/api", version = "0.1.0" }
ostd = { path = "../../../libs/ostd", version = "0.2.0" }
terminal-sdk = { path = "../../../libs/terminal", version = "0.1.0" }

[build-dependencies]
cell-build = { path = "../../../libs/cell-build", version = "0.2.0" }
