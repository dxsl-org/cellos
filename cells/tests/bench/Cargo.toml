[package]
name = "app-bench"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Cellos performance benchmark cell — measures context-switch, IPC, syscall, and memory targets"

[features]
restart-oracle = ["service-net-broker/restart-oracle"]

[dependencies]
ostd = { path = "../../../libs/ostd", version = "0.2.0" }
api  = { path = "../../../libs/api", version = "0.1.0" }
service-net-broker = { path = "../../services/net-broker", version = "0.1.0" }

[[bin]]
name = "bench"
path = "src/main.rs"

[[bin]]
name = "bench-probe"
path = "src/bench-probe.rs"

[[bin]]
name = "capacity-probe"
path = "src/capacity-probe.rs"

[build-dependencies]
cell-build = { path = "../../../libs/cell-build", version = "0.2.0" }
