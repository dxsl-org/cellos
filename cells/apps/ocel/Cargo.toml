[package]
name = "ocel"
version = "0.1.0"
edition = "2021"
license.workspace = true

[[bin]]
name = "ocel"
path = "src/main.rs"

[features]
# No explicit embedded feature: Cargo feature unification must not enable both profiles.
default = []
desktop = []

[dependencies]
ostd = { path = "../../../libs/ostd", version = "0.2.0" }
api = { path = "../../../libs/api", version = "0.1.0" }
viui = { path = "../../../libs/viui", version = "0.2.0" }
dom-arena = { path = "../../../libs/dom-arena", version = "0.1.0" }
ocel-pdf-proto = { path = "../../../libs/ocel-pdf-proto" }
ocel-service-proto = { path = "../../../libs/ocel-service-proto" }
postcard = { version = "1.0", default-features = false, features = ["alloc"] }
zune-core = { version = "0.5.3", default-features = false }
zune-png = { version = "0.5.2", default-features = false }
zune-jpeg = { version = "0.5.15", default-features = false }
taffy = { version = "=0.14.0", default-features = false, features = ["alloc", "taffy_tree", "block_layout", "flexbox", "grid"] }
ai-image-webp = { version = "0.2.4", default-features = false }
no_std_io = { version = "0.6", default-features = false }

[build-dependencies]
cell-build = { path = "../../../libs/cell-build", version = "0.2.0" }
