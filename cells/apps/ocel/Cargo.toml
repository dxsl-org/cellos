[package]
name = "ocel"
version = "0.1.0"
edition = "2021"
license.workspace = true

[[bin]]
name = "ocel"
path = "src/main.rs"

[dependencies]
ostd = { path = "../../../libs/ostd", version = "0.2.0" }
api = { path = "../../../libs/api", version = "0.1.0" }
viui = { path = "../../../libs/viui", version = "0.2.0" }
dom-arena = { path = "../../../libs/dom-arena", version = "0.1.0" }
postcard = { version = "1.0", default-features = false, features = ["alloc"] }

[build-dependencies]
cell-build = { path = "../../../libs/cell-build", version = "0.2.0" }
