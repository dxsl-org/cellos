[package]
name = "app-c2c-render"
version = "0.1.0"
edition = "2021"
license.workspace = true

[[bin]]
name = "c2c-render"
path = "src/main.rs"

[[bin]]
name = "c2c-render-worker"
path = "src/worker.rs"

[[bin]]
name = "c2c-render-domain-worker"
path = "src/domain_worker.rs"

[dependencies]
ostd = { path = "../../../libs/ostd", version = "0.2.0" }
api = { path = "../../../libs/api", version = "0.1.0" }
render-core = { path = "../../../libs/render-core" }
postcard = { version = "1.0", default-features = false, features = ["alloc"] }

[build-dependencies]
cell-build = { path = "../../../libs/cell-build", version = "0.2.0" }
