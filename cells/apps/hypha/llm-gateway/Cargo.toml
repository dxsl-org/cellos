[package]
name = "hypha-llm-gateway"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"

# Hypha LLM gateway. A Tier-1 service cell that receives `LlmRequest` over IPC,
# opens TLS to an OpenAI-compatible endpoint (a host-side proxy via QEMU NAT in
# P0/P1), POSTs a chat-completion, and replies `LlmReply`. TLS runs in the net
# service, so this cell needs NO network capability — only IPC to the net cell.

[[bin]]
name = "hypha-llm-gateway"
path = "src/main.rs"
test = false
doc = false

[features]
# Lab only: reach the QEMU host alias 10.0.2.2 in plaintext (mock_proxy.py --plain, :8080)
# instead of TLS. Off by default: whoever controls the wire writes the model's reply,
# which proposes the agent's tool calls. Every other endpoint is TLS regardless.
qemu-plaintext-llm = []

[dependencies]
ostd        = { path = "../../../../libs/ostd", version = "0.2.0", features = ["json"] }
abi         = { path = "../../../../libs/abi", version = "0.1.0" }
agent-proto = { path = "../../../../libs/agent-proto", version = "0.1.0" }
# Spec 24 consumer path: the gateway asks the on-device inference service (`service::AI`) first.
ai-proto    = { path = "../../../../libs/ai-proto", version = "0.1.0" }
ai-sdk      = { path = "../../../../libs/ai-sdk", version = "0.1.0", features = ["ostd-transport"] }
postcard    = { version = "1", default-features = false, features = ["alloc"] }

[build-dependencies]
cell-build = { path = "../../../../libs/cell-build", version = "0.2.0" }
