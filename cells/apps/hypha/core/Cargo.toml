[package]
name = "hypha-core"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"

# Hypha core — the agent brain. P1: an interactive chat loop. Reads a line from
# stdin (UART), keeps the conversation in heap, asks the llm-gateway over IPC,
# prints the reply. Spawns the gateway itself and talks to it by tid (needs the
# `spawn` capability; no service registry in P1). The confirmation gate, the
# preamble and the tool owner binding live in the lib so they are host-testable.

[[bin]]
name = "hypha-core"
path = "src/main.rs"
test = false
doc = false

[dependencies]
ostd        = { path = "../../../../libs/ostd", version = "0.2.0" }
abi         = { path = "../../../../libs/abi", version = "0.1.0" }
wire        = { path = "../../../../libs/wire", version = "0.1.0" }
agent-proto = { path = "../../../../libs/agent-proto", version = "0.1.0" }
postcard    = { version = "1", default-features = false, features = ["alloc"] }
# Policy constants only (workspace root, spawn allowlist) for the model preamble.
hypha-tool-fs    = { path = "../tools/fs", version = "0.1.0" }
hypha-tool-spawn = { path = "../tools/spawn", version = "0.1.0" }

[build-dependencies]
cell-build = { path = "../../../../libs/cell-build", version = "0.2.0" }
