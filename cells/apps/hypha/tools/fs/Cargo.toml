[package]
name = "hypha-tool-fs"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"

# Hypha tool-fs — filesystem tool cell for the Hypha AI agent (P2).
# Handles AgentToolRequest::Invoke{name,args_json} and dispatches to VfsClient.
# Supports: read_file, write_file, list_dir. No block_io cap — uses VFS IPC.
# The owner binding and workspace confinement live in the lib so they are
# host-testable; the bin is the no_main cell and has no host test harness.

[[bin]]
name = "hypha-tool-fs"
path = "src/main.rs"
test = false
doc = false

[dependencies]
ostd        = { path = "../../../../../libs/ostd", version = "0.2.0" }
abi         = { path = "../../../../../libs/abi", version = "0.1.0" }
agent-proto = { path = "../../../../../libs/agent-proto", version = "0.1.0" }
postcard    = { version = "1", default-features = false, features = ["alloc"] }

[build-dependencies]
cell-build = { path = "../../../../../libs/cell-build", version = "0.2.0" }
