[workspace]
members = ["manifest-core", "bundler"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MPL-2.0"
publish = false

[workspace.dependencies]
ed25519-compact = { version = "2", default-features = false }
sha2 = { version = "0.10", default-features = false }
zeroize = { version = "1", default-features = false }

[workspace.metadata.cellos]
evidence_boundary = "SOFTWARE_HARNESS"
authority_lane = "DEV_REFERENCE"
production_evidence = false
