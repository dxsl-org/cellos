timeout: 0
verbose: yes
serial: yes

# Generic VM lanes (KVM/VMware default guests, ADR-0031 D-VM) name the
# x86_64-vm profile. The kernel accepts it only under a hypervisor. Used through
# `X86_LIMINE_CONF=scripts/x86/limine-vm.conf bash scripts/x86/make-iso-ci.sh`.
/ViCell x86_64
    protocol: limine
    path: boot():/boot/kernel.elf
    cmdline: cellos.profile=x86_64-vm
    kaslr: no
