timeout: 0
verbose: yes
serial: yes

# No `cellos.profile=`: the kernel binds its default, strict x86_64-pc profile
# (DMA isolation required). Used by the PC lanes through
# `X86_LIMINE_CONF=scripts/x86/limine-pc.conf bash scripts/x86/make-iso-ci.sh`.
/ViCell x86_64
    protocol: limine
    path: boot():/boot/kernel.elf
    kaslr: no
