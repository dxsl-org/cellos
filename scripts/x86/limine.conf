timeout: 0
verbose: yes
serial: yes

# The QEMU lanes boot q35 without an IOMMU, so they name the q35 profile. The
# kernel accepts it only under a hypervisor; without `cellos.profile=` it binds
# the strict x86_64-pc profile (see scripts/x86/limine-pc.conf).
/ViCell x86_64
    protocol: limine
    path: boot():/boot/kernel.elf
    cmdline: cellos.profile=qemu-q35-x86_64
    kaslr: no
