# Source files under a crate's src/ that no `mod`/`#[path]` reaches. They are
# not compiled, so they cannot hold a linked declaration. (None today: the two
# dead kernel files were deleted in architecture remediation Phase 09.)

# ---- slice A ----
[[global]]
key = "kernel::kmain()::IDLE_COUNT"
lifetime = "global"
mutation = "atomic"
owner = "kernel::kmain idle loop (boards whose backend sets ArmPlatform::IDLE_PROBES > 0, today the RPi3 only): the BSP kmain thread is the sole writer and reader of this probe counter"
contexts = ["none"]
seal = "no x86_64 accessor; dead storage on this image (declared inside kmain's #[cfg(target_arch = \"aarch64\")] IDLE_PROBES block)"
retirement = "no x86_64 accessor; dead storage on this image"
rationale = "Its declaration and only accessor sit in kmain's #[cfg(target_arch = \"aarch64\")] `if IDLE_PROBES > 0` block (compiled away unless the board backend asks for idle probes, i.e. the Raspberry Pi 3); the discovery key omits that block-level cfg, so nothing is compiled into the x86_64 image. On rpi3 it is a Relaxed fetch_add diagnostic counter used by one thread and publishes no data."
review = "kernel/src/main.rs:1660-1675"

[[global]]
key = "kernel::platform::PLATFORM"
lifetime = "boot"
mutation = "once"
owner = "kernel::platform: platform::init publishes it on riscv64/aarch64; platform::with readers are riscv64-gated drivers (PLIC, virtio, UART, paging)"
contexts = ["none"]
seal = "no x86_64 accessor; dead storage on this image (BootOnce::initialize is cfg(any(test, riscv64, aarch64)) and platform::init is an empty fn on x86_64)"
retirement = "no x86_64 accessor; dead storage on this image"
rationale = "BootOnce writes the value then Release-stores `initialized`, and get() Acquire-loads it, which is correct write-once publication on the arches that use it. On x86_64 nothing initializes it and every platform::with caller is cfg(target_arch = \"riscv64\"), so the storage is never touched; a future x86 reader would panic in with()."
review = "kernel/src/platform.rs:126-131; kernel/src/platform.rs:230-238; kernel/src/platform/boot_once.rs:BootOnce::initialize; kernel/src/dev/virtio_common.rs:48-50; kernel/src/memory/paging.rs:179-182"

[[global]]
key = "kernel::cpu_features::HAS_H_EXT"
lifetime = "global"
mutation = "atomic"
owner = "kernel::cpu_features (only writer detect_riscv, riscv64); read by task::cap HypervisorCap grant via has_h_ext()"
contexts = ["normal"]
seal = "x86_64: never written (detect_riscv is cfg(riscv64)), constant false; riscv64: one Relaxed store in cpu_features::detect at kmain boot"
retirement = "never: lives for the whole run"
rationale = "On x86_64 it is a constant-false flag; its one compiled reader (cap.rs HypervisorCap grant in spawn) needs no ordering because nothing writes it. On riscv64 the single Relaxed boot store precedes secondary-hart start, which supplies the happens-before."
review = "kernel/src/cpu_features.rs:detect_riscv; kernel/src/cpu_features.rs:has_h_ext; kernel/src/task/cap.rs:396-399"

[[global]]
key = "kernel::cpu_features::HAS_EL2"
lifetime = "global"
mutation = "atomic"
owner = "kernel::cpu_features (only writer detect() under cfg(aarch64)); read by task::cap HypervisorCap grant via has_el2()"
contexts = ["normal"]
seal = "x86_64: never written (the store is cfg(target_arch = \"aarch64\")), constant false; aarch64 QEMU virt: one Relaxed store in cpu_features::detect at kmain boot"
retirement = "never: lives for the whole run"
rationale = "On x86_64 has_el2() takes the non-rpi3 branch and reads a constant-false flag in the spawn-time HypervisorCap grant, so no ordering is needed. On aarch64 the single Relaxed boot store precedes secondary-core start."
review = "kernel/src/cpu_features.rs:detect; kernel/src/cpu_features.rs:has_el2; kernel/src/task/cap.rs:396-399"

[[global]]
key = "kernel::cpu_features::X86_VIRT_KIND @cfg(target_arch = \"x86_64\")"
lifetime = "global"
mutation = "atomic"
owner = "kernel::cpu_features::detect (BSP, kmain:153) writes the SVM/VMX vendor from CPUID; read by kmain virt bring-up and hypervisor::svm_registry (create_vcpu, nested_format)"
contexts = ["boot", "normal"]
seal = "written once in cpu_features::detect at kmain:153, before the IDT exists and before start_secondaries"
retirement = "never: lives for the whole run"
rationale = "A single Relaxed store of a scalar on the BSP; the kmain reader is the same thread and syscall-path readers on either CPU run after the AP-start happens-before, so Relaxed carries no dependent data. The value reflects the BSP's CPUID only; cpu_feature_policy (AP admission) does not compare SVM/VMX bits."
review = "kernel/src/cpu_features.rs:detect; kernel/src/main.rs:635; kernel/src/hypervisor/svm_registry.rs:nested_format; kernel/src/hypervisor/svm_registry.rs:create_vcpu; hal/arch/x86/src/x86_64.rs:cpu_feature_policy"

[[global]]
key = "kernel::cpu_features::HAS_X86_VIRT"
lifetime = "global"
mutation = "atomic"
owner = "cpu_features: latch_x86_root_active after enter_x86_root_on_current_cpu succeeds on the BSP; every AP enters the same root mode in x86_secondary_main before it is published online; read by task::cap HypervisorCap grant and kmain smoke gates"
contexts = ["boot", "normal"]
seal = "latched at most once in kmain on the BSP before start_secondaries"
retirement = "never: lives for the whole run"
rationale = "Relaxed single-writer latch set before APs start. The flag stays system-wide because no CPU runs tasks without root operation: an AP that cannot enter it parks with X86_AP_ROOT_REFUSED and never sets HART_ONLINE, so a vCPU can only be scheduled on a CPU in root operation (CP1 p02-debt-semantic #1)."
review = "kernel/src/cpu_features.rs:enter_x86_root_on_current_cpu; kernel/src/main.rs (BSP root entry); kernel/src/sched/smp.rs:x86_secondary_main; kernel/src/sched/smp.rs:start_secondaries; kernel/src/task/cap.rs:396-399"

[[global]]
key = "kernel::system_config::LOGGING_EXPLICIT"
lifetime = "global"
mutation = "atomic"
owner = "kernel::system_config::load_from_vifs1 writes; kmain reads via logging_explicit() to decide the late log-level default"
contexts = ["boot"]
seal = "Release-stored once in load_from_vifs1 at kmain:918, before task::init and start_secondaries"
retirement = "never: lives for the whole run"
rationale = "Single writer and single reader are the BSP kmain thread (main.rs:918 then main.rs:1671); the Release/Acquire pair is stronger than needed and nothing else touches it."
review = "kernel/src/system_config.rs:load_from_vifs1; kernel/src/main.rs:918; kernel/src/main.rs:1671"

[[global]]
key = "kernel::boot::MEMORY_MAP_BUFFER"
lifetime = "boot"
mutation = "static-mut"
owner = "kernel::boot::parse_bootloader_info converts the Limine memory map into it and hands out a &'static slice inside LimineBootInfo; kmain (frame allocator setup) reads it"
contexts = ["boot"]
seal = "filled once by parse_bootloader_info at kmain:305 on the BSP before the frame allocator and before start_secondaries"
retirement = "never: storage persists; no reader after kmain's boot consumers"
rationale = "One call site on the BSP before any other CPU runs, so there is no concurrent access. Soundness rests on that single call: the function returns &'static views into a static mut, and a second call would rewrite entries under a live shared borrow."
review = "kernel/src/boot.rs:parse_bootloader_info; kernel/src/main.rs:305-316"

[[global]]
key = "kernel::boot::FALLBACK_MEMORY_MAP @cfg(target_arch = \"x86_64\")"
lifetime = "global"
mutation = "immutable"
owner = "kernel::boot fallback boot description (x86_64); read only through FALLBACK_BOOT_INFO"
contexts = ["boot"]
seal = "compile-time constant in .rodata; no writer"
retirement = "never: lives for the whole run"
rationale = "Plain `static` of a Copy struct with no interior mutability, so it cannot be mutated. Only reachable when parse_bootloader_info fails and kmain calls fallback_boot_info (unreachable under Limine per the boot.rs comment)."
review = "kernel/src/boot.rs:773-789; kernel/src/boot.rs:757-759; kernel/src/main.rs:308-316"

[[global]]
key = "kernel::boot::FALLBACK_BOOT_INFO @cfg(target_arch = \"x86_64\")"
lifetime = "global"
mutation = "immutable"
owner = "kernel::boot::fallback_boot_info returns &FALLBACK_BOOT_INFO to kmain when Limine responses are missing"
contexts = ["boot"]
seal = "compile-time constant in .rodata; no writer"
retirement = "never: lives for the whole run"
rationale = "Plain `static` SimpleBootInfo (slice reference plus integers) without interior mutability; read once by kmain on the BSP in the Limine-failure branch."
review = "kernel/src/boot.rs:790-795; kernel/src/boot.rs:757-759; kernel/src/main.rs:308-316"

[[global]]
key = "kernel::boot::limine::MEMORY_MAP_REQUEST"
lifetime = "boot"
mutation = "static-mut"
owner = "Limine bootloader writes `response`; kernel::boot::limine::get_memory_map reads it (parse_bootloader_info, get_limine_memory_entries, mp_record_valid)"
contexts = ["boot"]
seal = "`response` written by Limine before _start; no kernel store exists"
retirement = "never: .requests is RW for the whole run; response memory is bootloader-reclaimable and never admitted to the frame allocator"
rationale = "Written by the bootloader before any kernel instruction and only read afterwards on the BSP kmain thread (start_secondaries reads it before releasing the AP), so no race. Reads are plain loads of a `static mut` that no Rust code stores to; they rely on #[used] keeping LLVM from folding the null initializer [INFERENCE], whereas get_mp_response uses read_volatile for the same pattern."
review = "kernel/src/boot/limine.rs:get_memory_map; kernel/src/boot.rs:parse_bootloader_info; kernel/src/boot/limine.rs:mp_record_valid; kernel/linker-x86-64.ld:34-39"

