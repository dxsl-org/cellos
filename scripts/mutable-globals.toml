# Writable-global ownership inventory (ginux-lessons Phase 02).
#
# Checked by tools/mutable-globals (`--check` in CI); the generated report is
# docs/generated/mutable-globals.md. Every declaration the tool finds in a
# linked crate whose cfg is active (or not decidable) in the profile below, and
# whose type is not syntactically immutable, needs one [[global]] entry:
#
#   key         exact key from `--list` (module path, item, cfg chain)
#   lifetime    boot | per-cpu | per-cell | per-thread | global
#   mutation    atomic | spinlock | lock-other | once | static-mut | unsafe-cell |
#               immutable | linker | hardware-written | macro | asm | none
#   owner       the semantic owner (module/subsystem) that may mutate it
#   contexts    any of boot, normal, irq, nmi, ap, exception
#   seal        when initialization ends (or "none: mutated for the whole run")
#   retirement  quiescence/teardown rule (or "never: lives for the whole run")
#   rationale   why the mechanism fits the owner and contexts
#   review      code reference that supports the rationale (file:item)
#   debt        ONLY for an unresolved existing declaration: the reason. Debt may
#               say `unknown` in a dimension; a reviewed entry may not.
#
# A per-cpu or hardware-table lifetime is not a justification by itself; NMI and
# nested interrupts can still alias per-CPU state.

[profile]
name = "x86_64 QEMU (kernel default + policy-required)"
target_arch = "x86_64"
target_os = "none"
target_pointer_width = "64"
# Build-script cfgs are off unless their env vars are set; `test` is host-only.
cfg_false = ["test", "debug_assertions"]

[[crate]]
name = "kernel"
root = "kernel/src/main.rs"
manifest = "kernel/Cargo.toml"
active = true
features = ["default", "policy-required"]

