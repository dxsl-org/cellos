[[global]]
key = "kernel::task::syscall::dma_export::EXPORTS"
lifetime = "global"
mutation = "spinlock"
owner = "task::syscall::dma_export: the DMA export lease table (437/438/439, ADR-0033 CP1 §5) and per-holder-task IOVA window allocators; mutated by ExportDmaRange/MapDmaExport/RevokeDmaExport, the owner-death step of reap_retired_task_resources, the holder hook in teardown_dma_authority and the scheduler-pass retry"
contexts = ["normal", "irq"]
seal = "none: leases are created and dropped for the whole run"
retirement = "reap_retired_task_resources -> reap_owner(tid) revokes every lease the dead task owns; teardown_dma_authority -> holder_domain_revoked(tid) drops a dead holder's leases after its domain teardown is acknowledged; unacknowledged revokes stay Revoking and retry_pending repeats them each yield_cpu pass"
rationale = "Outermost lock of the export path (IOMMU_CLEANUP_SERIAL -> EXPORTS -> grant table -> SCHEDULER -> pin REGISTRY / VT-d UNITS -> FRAME_ALLOCATOR); never taken under another lock. The retirement funnel and retry run in yield_cpu, which the timer/IPI ISRs reach, and the crate Spinlock masks IRQs for the guard, so a same-CPU interrupt cannot re-enter it."
review = "kernel/src/task/syscall/dma_export.rs:ExportTable; kernel/src/task/syscall/dma_export.rs:reap_owner; kernel/src/task/syscall/dma_export.rs:holder_domain_revoked; kernel/src/task/syscall/dma_export.rs:retry_pending; kernel/src/task.rs:reap_retired_task_resources; kernel/src/task.rs:teardown_dma_authority"

[[global]]
key = "kernel::task::syscall::dma_export::NEXT_EXPORT_ID"
lifetime = "global"
mutation = "atomic"
owner = "task::syscall::dma_export: boot-wide export id counter; advanced only by ExportTable::export under EXPORTS"
contexts = ["normal"]
seal = "none: one id per accepted 437 for the whole run"
retirement = "never: ids are never reused within a boot"
rationale = "fetch_add hands each export a unique id (an id taken by an export refused afterwards is skipped, never reissued); EXPORTS already serializes issuers, the atomic only keeps the counter boot-wide across table instances in host tests."
review = "kernel/src/task/syscall/dma_export.rs:ExportTable::export"

[[global]]
key = "kernel::task::syscall::dma_export::REVOKING"
lifetime = "global"
mutation = "atomic"
owner = "task::syscall::dma_export: count of leases in Revoking; changed only under EXPORTS by set_state and drop_lease"
contexts = ["normal", "irq"]
seal = "none: changes with every unacknowledged revoke for the whole run"
retirement = "never: returns to 0 when every revoke is acknowledged"
rationale = "retry_pending reads it Relaxed in yield_cpu to skip EXPORTS when nothing is pending; a stale nonzero only costs one lock round, a stale zero delays the retry by one pass, never a frame release (frames stay locked/quarantined until the acknowledged retry)."
review = "kernel/src/task/syscall/dma_export.rs:retry_pending; kernel/src/task/syscall/dma_export.rs:ExportTable::set_state"

[[global]]
key = "kernel::task::syscall::dma_export::LEASES"
lifetime = "global"
mutation = "atomic"
owner = "task::syscall::dma_export: count of live or revoking leases; changed only under EXPORTS by export and drop_lease; read lock-free only by reap_owner"
contexts = ["normal", "irq"]
seal = "none: changes with every export and drop for the whole run"
retirement = "never: returns to 0 when every lease is dropped"
rationale = "reap_owner reads it Relaxed to skip EXPORTS on the common death of a task that never exported; a lease the dying owner holds was created by that task's own earlier 437, whose EXPORTS critical section and the scheduler handoffs to the retirement funnel order the increment before the read, so a dying owner never reads a stale zero for its own lease. holder_domain_revoked deliberately does not use it."
review = "kernel/src/task/syscall/dma_export.rs:reap_owner; kernel/src/task/syscall/dma_export.rs:holder_domain_revoked"
