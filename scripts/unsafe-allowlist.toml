reason = "Deliberate CFI violation: an inline-asm indirect call (BLR / CALL reg) to cfi_test_unpadded_target, the instruction right after a BTI c / ENDBR64 landing pad in the cell's own executable .text; a control call to the landing pad first proves the page is executable, so a fault can only be BTI/IBT, not NX. Fixed 2026-11-10: the old target was a .rodata byte array (non-executable, misaligned on aarch64), so it proved NX. Since 2026-11-10 the kernel arms BTI (stage-1 GP) / CPL3 IBT (IA32_U_CET) for an image carrying the GNU property opt-in, so an opted-in build faults there; scripts/qemu-cfi-test.sh builds it opted in and asserts the aarch64 EC 0x0D fault (x86: the cell itself FAILs when CPUID reports IBT and the call returns); riscv64 skips (no Zicfilp). Re-reviewed 2026-11-16: seven `unsafe` tokens, unchanged: the `ProbeFn = unsafe extern \"C\" fn() -> u32` alias (main.rs:142), the two per-arch `unsafe fn indirect_call` with `# Safety` docs (:159, :182) and their commented `asm!` blocks (`blr` :164, `call` :188, each `clobber_abi(\"C\")`), the commented control call to the landing pad (:236) and the commented violating call (:246). The per-arch `global_asm!` blocks (:90, :111) still place both labels in `.text.cfi_test_targets`, and scripts/qemu-cfi-test.sh still asserts EC 0x0D (:171-:175). The crate is LEGACY (Tier 1); `test-violation` is not gated."
