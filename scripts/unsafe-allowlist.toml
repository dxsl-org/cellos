[[file]]
path = "cells/demos/cfi-test/src/main.rs"
class = "test-violation"
reason = "Deliberate CFI violation: an inline-asm indirect call (BLR / CALL reg) to cfi_test_unpadded_target, the instruction right after a BTI c / ENDBR64 landing pad in the cell's own executable .text; a control call to the landing pad first proves the page is executable, so a fault can only be BTI/IBT, not NX. Fixed 2026-11-10: the old target was a .rodata byte array (non-executable, misaligned on aarch64), so it proved NX. Since 2026-11-10 the kernel arms BTI (stage-1 GP) / CPL3 IBT (IA32_U_CET) for an image carrying the GNU property opt-in, so an opted-in build faults there; scripts/qemu-cfi-test.sh builds it opted in and asserts the aarch64 EC 0x0D fault (x86: the cell itself FAILs when CPUID reports IBT and the call returns); riscv64 skips (no Zicfilp)."
approver = "cellos-maintainers"
date = "2026-07-14"
review_by = "2027-02-08"
tracking = "unsafe-allowlist re-review 2026-11-10: NX-instead-of-BTI/IBT defect fixed; per-Cell BTI/IBT opt-in enforcement added the same day (item 3)"

[[file]]
path = "cells/tests/wx-test/src/main.rs"
class = "test-violation"
reason = "Deliberate W^X violation — the cell writes its own .text to prove the loader's post-relocation lowering pass (kernel/src/loader/wx.rs) actually revokes WRITE. A cell honouring forbid(unsafe_code) cannot exercise a hardware page-permission bit, so the unsafe IS the test. Pass is decided by the kernel log, not by this cell. Re-reviewed 2026-11-10 (1 write_volatile, commented; no defect): if the write succeeds nothing calls the corrupted function and the cell exits immediately."
approver = "cellos-maintainers"
date = "2026-07-30"
review_by = "2027-02-08"
tracking = "unsafe-allowlist 90-day re-review 2026-11-10"

[[file]]
path = "cells/services/compositor/src/surface_table/pixels.rs"
class = "legacy-raw-ptr"
reason = "Forms a slice over a shared Grant that GrantSlice resolved for this task immediately before each blit (no cached pointer); a Grant that no longer resolves or is too small is detached instead. The resolve passes a3 LEASE (approved 2026-11-10): the kernel publishes a holder lease in the lookup's grant-table transaction, so the owner's GrantFree/GrantUnregister is refused and its death quarantines the frames until the compositor's next receive or next send to that owner, both after the blit. Re-reviewed 2026-11-16: still exactly one `unsafe` site (pixels.rs:122), `slice::from_raw_parts(ptr, needed)` over the pointer and length the leased resolve just returned; the returned borrow of `self` ends with the blit, so the slice cannot outlive the lease. The crate's Tier-1 placement is the owner's signed [[tier_exception]] below."
approver = "lungmat8"
date = "2026-08-25"
review_by = "2027-02-14"
tracking = "P18 review 2026-11-16: 90-day re-review (would have gone stale 2026-11-23)"

