# F1 unsafe allowlist — approved holes in the language-based isolation wall.
#
# Consumed by `scripts/cellos-sign` (see `scripts/cellos_sign/__init__.py` for the
# threat model). Two exemption kinds, checked independently:
#
#   [[file]]   this .rs file may contain the `unsafe` keyword (token layer)
#   [[crate]]  this crate's roots need not carry #![forbid(unsafe_code)]
#              (attribute layer)
#
# Every entry needs `class`, `reason`, `approver`, `date`. Entries that are meant
# to expire also carry `review_by` and `tracking`; `--check` reports any entry
# past `review_by`, or older than `max_age_days` when it has none, so a temporary
# exemption cannot quietly become permanent.
#
# Review an addition the way you would review the unsafe itself: this file *is*
# the hole. It never loosens by accident — `--check` also reports entries whose
# file no longer contains unsafe, so the list can be tightened.
#
# `approver = "cellos-maintainers"` on the entries dated 2026-07-14 records the
# truth: they were migrated wholesale from the ALLOWLIST set in the retired
# `scripts/check-cells-unsafe-ratchet.py`, which was reviewed as a group on that
# date and named no individual. New entries name a person.

version = 1

# Days after which an entry without an explicit `review_by` is reported as
# overdue. Reporting only — the ratchet never loosens itself on a timer.
max_age_days = 90

