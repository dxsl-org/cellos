reason = "Raspberry Pi 3 VideoCore display driver, shipped in the Pi 3 desktop image (scripts/make-hypervisor-fs-rpi3.sh) beside service-compositor; its tier-less manifest loads it in Tier 1. main.rs:107 forms a slice with `slice::from_raw_parts` over the pointer and length of a GpuFlush (OP_FLUSH) message that the kernel relays from the compositor as sender TID 0; the handler checks only non-null and no overflow, so the mapping and its lifetime are the compositor's, trusted through the Tier-1 shared address space. Exit: receive the frame as a leased Grant (as the compositor's own blit does) or a bounded copy, then drop the class. Re-confirmed 2026-11-16 (P19 wave): the source manifest still reads LEGACY, main.rs:107 is still the crate's only `legacy-raw-ptr` site, and scripts/make-hypervisor-fs-rpi3.sh still builds and signs driver-bcm-display (:233, :255)."
