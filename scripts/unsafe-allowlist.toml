# ── Tier exceptions: Tier-1 crates that keep a c-ffi / legacy-raw-ptr entry ────
#
# Each one is a signed triage item: `crate` and `class` name the entry it covers,
# `manifest` the manifest class it accepts (a change of class re-opens review),
# and `review_by` is required. An exception that covers no mismatch is reported,
# and is a violation under --strict, so the list cannot rot. An exception changes
# nothing in the kernel: the crate keeps its Tier-1 placement and its authority.

[[tier_exception]]
crate = "service-net"
class = "legacy-raw-ptr"
manifest = "LEGACY"
reason = "Boot network service, shipped in every x86, RISC-V and AArch64 image; holds the network capability (x86 PKU floor TRUSTED_CORE). tls/{dispatch,socket,transport}.rs erase a SocketSet borrow into task-local raw pointers for one poll_future call. Tier 2 needs a domain backend (native-domains + cellos_wide, kernel/src/loader/domain_admission.rs architecture_covered); without one a signed FFI/UNTRUSTED cell is refused, so a reclassification would stop networking on those configurations. Exit: replace the pointer bridge with an owned poll context, then drop the class."
approver = "lungmat8 (owner, S8b approval 2026-11-16)"
date = "2026-11-16"
review_by = "2027-02-14"
tracking = "Phase 18 Deviation Log 2026-11-16 (owner): signed tier exception"

[[tier_exception]]
crate = "service-compositor"
class = "legacy-raw-ptr"
manifest = "ABSENT"
reason = "Desktop compositor, shipped in the x86 desktop and the RISC-V, AArch64 and Pi 3 desktop images; it declares no manifest, so it loads as Tier 1. surface_table/pixels.rs blits from a client Grant through a slice formed right after GrantSlice (leased) resolves it; zero-copy shared-address-space grants are a Tier-1 IPC mechanism (Spec 18). Exit: a safe bounded-copy accessor in ostd, then drop the class."
approver = "lungmat8 (owner, S8b approval 2026-11-16)"
date = "2026-11-16"
