class = "test-harness"
reason = "Per-task FP register file regression test: one `asm!` block per architecture (riscv64: f0-f31 and fcsr; aarch64: q0-q31, FPCR and FPSR) loads a known pattern, issues the Yield trap, and stores the registers back, so nothing but the trap and the kernel's scheduling runs between load and read-back. That is the only way to observe whether the kernel hands a task another task's FP state. One `unsafe` token (regs.rs:353) wraps whichever `fp_yield_asm!` the target selects. riscv64 declares every FP register clobbered; aarch64 (softfloat target, vector registers cannot be named as clobbers) saves the file it found and restores it before the block ends. The trap uses ostd's syscall ABI. The manifest is FFI (Tier 2) on riscv64 and STANDARD (Tier 1, counted in the Tier-1 total) on aarch64, where Tier 2 admission is refused on production and EL2 hosts."
