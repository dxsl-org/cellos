[[lane]]
path = "scripts/qemu-aarch64-test-hooks.sh"
arch = "aarch64"
tier = "manual"
reason = "not named by any workflow as of 2026-11-10. Both modes pass as of 2026-11-16 (Phase 19). Its EL2 mode (CELLOS_AARCH64_TEST_HOOKS_DEVELOPMENT_SILO=1, virtualization=on) boots on cortex-a76 (FEAT_VHE, so the host runs at EL2); the EL2 host has no private roots, so S22-AARCH64-ROOT-SWITCH and S22-AARCH64-ASID-INVALIDATION log SKIP there and the lane requires the ROOT-SWITCH SKIP line. The default mode boots cortex-a57 at EL1 and requires ROOT-SWITCH PASS."

