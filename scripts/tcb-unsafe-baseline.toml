# Tier-1 closure baseline — reviewed ceilings on the `unsafe` linked into Tier-1 cells.
#
# Consumed by `scripts/cellos-sign` (scripts/cellos_sign/tcb.py) in every --check
# and before every --sign. The closure is scripts/tier1-closure.generated.toml
# (generated from `cargo metadata`, drift-checked in CI): these rows cover the
# in-tree packages it lists. Third-party crates are not counted here; they are
# pinned at name@version in the generated file.
#
#   [[site]]  one file of an in-tree closure package that uses `unsafe` or an
#             unsafe attribute. Two ceilings: `unsafe` (keyword tokens, the F1
#             token rule) and `attrs` (`no_mangle`, `export_name`, `link_section`
#             and `global_asm!`: what rustc's `unsafe_code` lint rejects without
#             the keyword). Same lexer as the cell scan: comments and literals do
#             not count; `#[cfg(test)]` modules inside src/ do.
#   [total]   ceiling on the Tier-1 total: tokens and attributes in cells/ crates
#             whose manifest leaves them in Tier 1, plus the closure. Moving
#             `unsafe` from cells into a library passes only if the sum does not
#             grow.
#
# Ratchet: a count above a ceiling, or a closure file with a count and no row,
# fails. A count below a ceiling, or a row for a file that is gone, is a NOTE; it
# fails CI (`cellos-sign --check --strict`) but not signing, so a ceiling is
# lowered in the same commit that removes the unsafe — `cellos-sign
# --write-baseline` does it mechanically and never raises one. Raising a ceiling
# or adding a row is reviewed like an allowlist entry: this file *is* the hole.
#
# Baseline taken 2026-11-16 (Phase 18, owner decision: combined total of cells
# plus closure; attributes as a second per-file ceiling), approver dmin. At that
# point: cells 178 unsafe / 7 attrs + closure 411 / 23 = 589 / 30. libs/posix-shim
# (160 / 136) left the closure when app-c-math-smoke declared PROTECTION_CLASS_FFI.
# 2026-11-16, P18 review: `global_asm!` now counts as an attribute (rustc rejects
# it under forbid(unsafe_code)); no code changed. Cells +4 (cfi-test 2, silo-guest
# 2) and libs/ostd/src/startup/libc_hook.rs 3: 589 / 37. The closure now resolves
# --all-features: 19 more third-party pins, no new in-tree crate with a count.
# 2026-11-21 N-3 bounded flush, owner-approved: virtio_drivers blk.rs 5 -> 8
# (flush_nb, complete_flush, one test block); cells -2 (virtio-blk io.rs 6 replaces
# io_x86.rs 4; mmio.rs/hal_x86.rs drop 4 NonNull::new_unchecked): 590 / 37.

version = 1

[total]
unsafe = 590
attrs = 37

