[graph]
targets = [
  { triple = "riscv64gc-unknown-none-elf" },
  { triple = "aarch64-unknown-none-softfloat" },
  { triple = "x86_64-unknown-none" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
  "https://github.com/rafalh/rust-fatfs",
]

[advisories]
version = 2
# yanked crates are denied by default in 0.15+
# unmaintained/unsound: "all" = check all deps, "workspace" = workspace only
unmaintained = "all"
ignore = [
  # ttf-parser: author declared it unmaintained, no safe upgrade exists yet.
  # skrifa is a different API surface — migrating ViUI's font rendering is a
  # real engineering task, not a CI fix. Revisit when skrifa is evaluated.
  { id = "RUSTSEC-2026-0192", reason = "no safe upgrade available; migration to skrifa is a separate task" },
  # rsa (Marvin timing sidechannel) comes in via embedded-tls for TLS
  # certificate SIGNATURE VERIFICATION only — a public-key operation. The
  # Marvin attack requires an RSA private-key decryption timing oracle, which
  # Cellos never exposes (no RSA private keys, no RSA decryption service).
  # No fixed rsa release exists; revisit when RustCrypto ships one.
  { id = "RUSTSEC-2023-0071", reason = "rsa used only for TLS cert signature verification (public-key op); no private-key decryption oracle exists in Cellos; no fixed release available" },
  # crypto-bigint 0.5 (via p256/p384 0.13) is not constant-time. In this workspace
  # p256 is verify-only in service-kms and attestation (signing exists only under
  # cfg(test)). The one secret use is embedded-tls 0.19 ECDHE, with one ephemeral
  # key per handshake. The long-term P-256 signer, silo-guest, is its own
  # workspace on p256 0.14 and is checked by its own CI step. Remove this entry
  # once embedded-tls moves to p256 0.14. Review by 2027-01-31.
  { id = "RUSTSEC-2026-0387", reason = "workspace p256 is verify-only plus ephemeral TLS ECDHE in embedded-tls 0.19 (no p256 0.14 release); long-term signer silo-guest is on the patched line" },
  # heapless 0.8.0 (ostd, service-net, and smoltcp 0.11, whose 0.13+ releases move to
  # heapless 0.9); the 0.9 line is on the patched 0.9.4. Each advisory below is in an
  # API nothing in the workspace calls: the workspace and smoltcp 0.11 use only Vec,
  # String, Deque (no try_from, no make_contiguous) and LinearMap. 0577 needs a
  # panicking element Drop to unwind through Deque::clear or vec::IntoIter::drop;
  # every profile and Cellos target is panic = "abort". Remove all nine once smoltcp
  # (0.13+) and ostd/service-net move to heapless 0.9. Review by 2027-01-31.
  { id = "RUSTSEC-2026-0574", reason = "heapless 0.8 SortedLinkedList::FindMutView unused in the workspace" },
  { id = "RUSTSEC-2026-0575", reason = "heapless 0.8 spsc unused in the workspace" },
  { id = "RUSTSEC-2026-0576", reason = "heapless 0.8 IndexMap unused in the workspace" },
  { id = "RUSTSEC-2026-0577", reason = "heapless 0.8 unwinding-drop paths unreachable: every profile and target is panic=abort" },
  { id = "RUSTSEC-2026-0578", reason = "heapless 0.8 SortedLinkedList unused in the workspace" },
  { id = "RUSTSEC-2026-0579", reason = "heapless 0.8 Deque TryFrom unused (smoltcp 0.11 and the workspace never call it)" },
  { id = "RUSTSEC-2026-0580", reason = "heapless 0.8 pool/treiber stack unused in the workspace" },
  { id = "RUSTSEC-2026-0581", reason = "heapless 0.8 Deque::make_contiguous unused (smoltcp 0.11 and the workspace never call it)" },
  { id = "RUSTSEC-2026-0582", reason = "heapless 0.8 IndexMap unused in the workspace" },
]

[licenses]
confidence-threshold = 0.93
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MPL-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "0BSD",
  "Zlib",
]

# Copyleft policy: docs/decisions/0030-license-model-and-copyleft-boundary.md.
# A GPL/AGPL/LGPL crate is admitted only by name and only as a leaf application
# Cell. scripts/check-copyleft-leaves.sh fails if any crate depends on one.
# Never add a copyleft exception for kernel/, hal/, libs/ or any driver Cell.
[[licenses.exceptions]]
allow = ["GPL-2.0-only"]
name = "doom"

[[licenses.exceptions]]
# Optional Ocel PDF renderer linking MuPDF (ADR-0017); omitted by CELLOS_NO_OCEL_PDF=1.
allow = ["AGPL-3.0-or-later"]
name = "ocel-pdf"

[[licenses.exceptions]]
# Mozilla CA root list (data, not code), pulled in by service-net TLS.
allow = ["CDLA-Permissive-2.0"]
name = "webpki-roots"

[[licenses.exceptions]]
# redoxfs uses license-file; vendored in third_party/ under MIT
allow = ["MIT"]
name = "redoxfs"

[bans]
multiple-versions = "warn"
wildcards = "deny"
