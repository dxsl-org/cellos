[package]
name = "ai-sdk"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "AiClient — the Spec 24 §6 public programming surface for the Cellos AI inference service"

[lints.rust]
unsafe_code = "deny"

[dependencies]
ai-proto = { path = "../ai-proto", version = "0.1.0" }
api = { path = "../api", version = "0.1.0" }
ostd = { path = "../ostd", version = "0.2.0", optional = true }

[features]
default = []
# Target-side transport (typed IPC through ostd). Off for host tests.
ostd-transport = ["dep:ostd"]
