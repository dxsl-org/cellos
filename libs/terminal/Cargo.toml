[package]
name = "terminal-sdk"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"

# HOST TESTS: run with an explicit host triple, e.g.
# `cargo test -p terminal-sdk --target x86_64-unknown-linux-gnu`.
# Like libs/text-engine, this crate deliberately defines NO #[global_allocator]
# and NO #[panic_handler], allowing pure host tests with the std harness.
# In production builds, this crate is `#![no_std]` + `alloc`.

[dependencies]
types = { path = "../types", version = "0.1.0" }
api = { path = "../api", version = "0.1.0" }
ostd = { path = "../ostd", version = "0.2.0" }
