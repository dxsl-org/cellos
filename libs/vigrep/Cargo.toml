[package]
name = "vigrep"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "no_std + alloc adaptation of ripgrep 15.2.0's matcher, regex, searcher, globset and ignore crates, with a serial walker over a search-tree trait"

# HOST TESTS: the workspace pins a bare-metal default target, so run them with an
# explicit host triple: `cargo test -p vigrep --target x86_64-unknown-linux-gnu`.
#
# Provenance: see PROVENANCE (per-file upstream path + SHA-256), LICENSE-MIT
# (upstream, verbatim) and THIRD-PARTY-NOTICES.
#
# Dependencies are exact pins with default features off, identical to the
# S7-0 compiled subset (phase-07-s0-admission.md §5/§9). No `std` feature of
# any dependency is requested, so the crate builds for x86_64-unknown-none and
# the Cellos target JSON with `-Z build-std=core,alloc`.

[dependencies]
memchr = { version = "=2.8.3", default-features = false, features = ["alloc"] }
aho-corasick = { version = "=1.1.4", default-features = false, features = ["perf-literal"] }
regex-automata = { version = "=0.4.16", default-features = false, features = ["alloc", "syntax", "meta", "nfa", "hybrid", "dfa-onepass", "perf", "unicode"] }
regex-syntax = { version = "=0.8.11", default-features = false, features = ["unicode"] }
log = { version = "=0.4.33", default-features = false }
bstr = { version = "=1.13.1", default-features = false, features = ["alloc"] }

[dev-dependencies]
# Ported upstream matcher/searcher tests compare against the regex crate.
regex = "=1.13.1"
