[package]
name = "wire"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lints.rust]
# Deny unsafe code by default, but allow exceptions in specific modules (e.g., allocator)
unsafe_code = "deny"

[dependencies]
abi = { path = "../abi", version = "0.1.0" }
types = { path = "../types", version = "0.1.0" }
postcard = { version = "1", default-features = false, features = ["postcard-derive"] }
serde = { version = "1", default-features = false, features = ["derive"] }

[features]
default = []
# Non-production contract for hostile hypervisor backend recovery images.
hostile-backend-recovery = []
