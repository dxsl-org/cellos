# Kernel residents (architecture remediation Phase 09; Spec 15 §2–§3).
#
# Every Rust source file under kernel/src, and why it is in the kernel.
# `scripts/check-kernel-residents.py` fails on an unlisted file, a listed file
# that no longer exists, an unknown category, or an exception without a
# migration target.
#
# category:
#   A          hardware-mandated mechanism (Spec 15 §2 A, incl. the amended
#              IPC/futex/pipe/session row)
#   B          security root of trust (Spec 15 §2 B)
#   C          bootstrap chicken-and-egg (Spec 15 §2 C)
#   D          hardware exclusivity arbiter (Spec 15 §2 D)
#   exception  a resident Spec 15 §3 forbids; `target` names where it goes
#   test       fixture, self-test or measurement-only code; never compiled into
#              a release kernel
#
# owner: the top-level kernel module that owns the file.

[residents]
