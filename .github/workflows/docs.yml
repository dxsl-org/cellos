name: Docs

on:
  push:
    branches: [main]
    paths: ['docs/**', 'libs/**', 'kernel/**', 'cells/**', 'hal/**']
  workflow_dispatch:

# `rustdoc` alone widens to contents: write (its gh-pages push).
permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  rustdoc:
    name: Build and deploy rustdoc
    runs-on: ${{ vars.CI_SELF_HOSTED == 'true' && fromJSON('["self-hosted","linux","X64","cellos-ci"]') || 'ubuntu-24.04' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-11-10
        with:
          toolchain: nightly-2026-05-01
          components: rust-src
      - if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with: { cache-on-failure: true }
      # rustdoc executes build scripts: littlefs2-sys compiles its vendored C
      # core, so the cross gcc + freestanding headers are required (same as
      # the CI lint job); the excluded crates need toolchain pieces CI does
      # not have (prebuilt mlibc, doomgeneric clone, a full libc for lua).
      - name: Install cross C compiler for littlefs2-sys
        timeout-minutes: 15
        uses: ./.github/actions/apt-install
        with:
          packages: gcc-riscv64-unknown-elf
      - name: Build rustdoc
        env:
          CC_riscv64gc_unknown_none_elf: riscv64-unknown-elf-gcc
          # The gitignored .cargo/config.toml also pins the archiver; without this
          # cc-rs probes for the xpack name (`riscv-none-elf-ar`) and every crate
          # that compiles C in its build script fails the whole doc build with
          # `failed to find tool "riscv-none-elf-ar"`. Same mirror as the CI lint
          # job — and the same reason it is spelled out there.
          AR_riscv64gc_unknown_none_elf: riscv64-unknown-elf-ar
          CFLAGS_riscv64gc_unknown_none_elf: -march=rv64gc -mabi=lp64d -mcmodel=medany -ffreestanding -DLFS_NO_INTRINSICS -I${{ github.workspace }}/third_party/freestanding-include
        run: >
          cargo doc --workspace --no-deps
          --exclude app-mlibc-smoke
          --exclude doom
          --exclude tetris-c
          --exclude lua
          --exclude tetris-lua
          --target riscv64gc-unknown-none-elf
          -Z build-std=core,alloc
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/riscv64gc-unknown-none-elf/doc
          destination_dir: api
