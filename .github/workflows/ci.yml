name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# ⚠ Do NOT add a workflow-level RUSTFLAGS here. The RUSTFLAGS env var REPLACES
# (does not merge with) per-target rustflags — a global "-D warnings" silently
# dropped relocation-model=pic (riscv64), code-model=kernel/static (x86_64)
# and +bti,+paca,+pacg (aarch64), breaking every link. Warnings are gated by
# the clippy jobs (`-- -D warnings`) instead.
#
# The CARGO_TARGET_*_RUSTFLAGS below mirror .cargo/config.toml, which is
# GITIGNORED (it carries machine-specific [env] paths) and therefore never
# reaches CI. Target-scoped env vars affect only their own triple, and a
# step-level RUSTFLAGS (e.g. the test-hooks kernel build) still overrides
# them — same precedence as the local config file. Keep the three values in
# sync with .cargo/config.toml.
env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  # riscv64: pic for kernel (la→GOT self-relocation) AND cells (avoids
  # absolute R_RISCV_64 relocations that -pie linking rejects).
  CARGO_TARGET_RISCV64GC_UNKNOWN_NONE_ELF_RUSTFLAGS: "-C relocation-model=pic"
  # x86_64: Limine-compatible static kernel, no red zone, and LLVM CET
  # branch/return protection.
  CARGO_TARGET_X86_64_UNKNOWN_NONE_RUSTFLAGS: "-C code-model=kernel -C no-redzone=yes -Z cf-protection=full -C relocation-model=static"
  # aarch64: pic for kernel and cells (matches run-arm-virt.ps1 /
  # build-aarch64-cells.ps1) + BTI/PAC codegen.
  CARGO_TARGET_AARCH64_UNKNOWN_NONE_SOFTFLOAT_RUSTFLAGS: "-C relocation-model=pic -C target-feature=+bti,+paca,+pacg"

jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Fast static guard (no build): every Cell's linker base must be off the kernel
      # MMIO identity maps, below RAM, and unique. In the SAS all cells share one page
      # table, so a colliding base silently clobbers MMIO/neighbour PTEs. Runs first so
      # a layout regression fails in seconds, before the expensive clippy/build.
      - name: Check Cell VA layout (SAS)
        run: python3 scripts/check-cell-va-layout.py

      # Second fast static guard: the CARGO_TARGET_*_RUSTFLAGS block below is a
      # hand-maintained mirror of scripts/cargo-config-linux.toml, because
      # .cargo/config.toml is gitignored and never reaches CI. Those flags decide
      # relocation model and target features, so a silent drift produces a build
      # that succeeds in one place and fails in the other with no code defect.
      - name: Check cargo config / CI codegen-flag parity
        run: python3 scripts/check-cargo-config-parity.py

      - name: Check generated code metrics
        run: python3 scripts/generate-code-metrics.py --check

      - name: Validate app-tier acceptance ledger
        run: |
          baseline_dir="$RUNNER_TEMP/app-tier-acceptance-baseline"
          baseline_json="$RUNNER_TEMP/app-tier-acceptance-baseline.json"
          base_ref="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            base_ref="$(PYTHONPATH=scripts python3 -c 'from app_tier_acceptance.baseline_ref import dispatch_baseline; print(dispatch_baseline("${{ github.ref_name }}", "${{ github.event.repository.default_branch }}"))')"
          elif [ -z "$base_ref" ] || [ "$base_ref" = "0000000000000000000000000000000000000000" ]; then
            echo "missing trusted push baseline" >&2
            exit 1
          fi
          if git cat-file -e "$base_ref:docs/app-tier-acceptance-ledger.json" 2>/dev/null; then
            baseline_ref="$(PYTHONPATH=scripts python3 -c 'import sys; from app_tier_acceptance.baseline_ref import trusted_snapshot; print(trusted_snapshot(sys.argv[1]))' "$base_ref")"
            git show "$baseline_ref:docs/app-tier-acceptance-ledger.json" > "$baseline_json"
            git worktree add --detach "$baseline_dir" "$baseline_ref"
            python3 scripts/validate-app-tier-acceptance.py \
              --baseline "$baseline_json" --baseline-root "$baseline_dir"
          else
            python3 scripts/validate-app-tier-acceptance.py
          fi
          python3 -m unittest discover -s tests/app-tier-acceptance -p 'test_*.py'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-01
          components: rust-src,rustfmt,clippy

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --all --check

      # clippy executes build scripts: littlefs2-sys (via service-vfs) compiles
      # its vendored C core, so the riscv64 cross gcc must be present even for
      # a lint-only job.
      - name: Install cross C compiler for littlefs2-sys
        timeout-minutes: 10
        run: sudo apt-get update -q && sudo apt-get install -y -q gcc-riscv64-unknown-elf

      - name: Clippy (riscv64 target)
        env:
          CC_riscv64gc_unknown_none_elf: riscv64-unknown-elf-gcc
          # -I …/freestanding-include: Ubuntu's bare-metal gcc ships no libc
          # headers; littlefs includes <string.h>, served by the vendored set.
          CFLAGS_riscv64gc_unknown_none_elf: -march=rv64gc -mabi=lp64d -mcmodel=medany -ffreestanding -DLFS_NO_INTRINSICS -I${{ github.workspace }}/third_party/freestanding-include
        # Same exclusions as the Build job: these crates' build scripts compile
        # vendored C that needs toolchain pieces CI does not have (lua needs
        # signal.h/stdio.h — a full libc, not just the vendored string.h).
        run: >
          cargo clippy
          --workspace
          --exclude app-mlibc-smoke
          --exclude doom
          --exclude tetris-c
          --exclude lua
          --exclude tetris-lua
          --target riscv64gc-unknown-none-elf
          -Z build-std=core,alloc
          -- -D warnings

  board-configs:
    name: Board configuration matrix
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-01
          components: rust-src
          targets: riscv64gc-unknown-none-elf,aarch64-unknown-none-softfloat,x86_64-unknown-none

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: board-configs

      - name: Check HAL ownership and every board selection
        run: bash scripts/check-board-configs.sh

  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # cells_args: what the "Build cells + libs" step compiles.
          # rv64/aarch64 build the whole workspace minus crates that need
          # artifacts CI can't have (see the step comment). x86_64 mirrors
          # scripts/build-x86_64-cells.ps1's curated set instead — several
          # cells (c-math-smoke, posix shims) are riscv/aarch64-only.
          - target: riscv64gc-unknown-none-elf
            short: rv64
            cc_pkg: gcc-riscv64-unknown-elf
            cc_bin: riscv64-unknown-elf-gcc
            cells_args: >-
              --workspace --exclude cellos-kernel --exclude app-mlibc-smoke
              --exclude doom --exclude tetris-c --exclude lua --exclude tetris-lua
          - target: aarch64-unknown-none-softfloat
            short: aarch64
            cc_pkg: gcc-aarch64-linux-gnu
            cc_bin: aarch64-linux-gnu-gcc
            cells_args: >-
              --workspace --exclude cellos-kernel --exclude app-mlibc-smoke
              --exclude doom --exclude tetris-c --exclude lua --exclude tetris-lua
          - target: x86_64-unknown-none
            short: x86_64
            cc_pkg: ""
            cc_bin: cc
            cells_args: >-
              -p app-init -p app-shell -p service-vfs -p service-config
              -p service-platform -p driver-nvme -p driver-e1000 -p app-sys-tools
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-01
          components: rust-src

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: ${{ matrix.short }}

      # littlefs2-sys (pulled in via redoxfs) compiles a vendored C shim for
      # whatever target `-Z build-std` is cross-compiling to; cc-rs looks for a
      # <target>-gcc by convention and finds nothing on a bare `-none` target
      # unless we install and point it at a matching cross compiler.
      - name: Install cross C compiler for littlefs2-sys
        if: matrix.cc_pkg != ''
        timeout-minutes: 10
        run: sudo apt-get update -q && sudo apt-get install -y -q ${{ matrix.cc_pkg }}

      # scripts/build-boot-ramdisk-ci.sh bakes a signed /POLICY.BIN, and
      # scripts/sign-policy.py needs Ed25519 from `cryptography`. Without this the
      # assemble step below aborts (the script runs under `set -e`), which fails
      # the rv64 build and starves the QEMU boot gate of its artifact.
      - name: Install Python cryptography (policy blob signing)
        if: matrix.short == 'rv64'
        timeout-minutes: 5
        run: python3 -m pip install --user --quiet cryptography

      # The rv64 artifact feeds the QEMU boot gate, and kernel_fs.img (VIFS1
      # ramdisk, gitignored build artifact) must be real — build.rs otherwise
      # embeds an empty compile-only stub that cannot boot.
      - name: Assemble bootstrap kernel_fs.img (rv64)
        if: matrix.short == 'rv64'
        run: bash scripts/build-boot-ramdisk-ci.sh

      - name: Build kernel (release)
        # Kernel codegen flags come from the workflow-level CARGO_TARGET_*
        # mirrors of .cargo/config.toml — do NOT set RUSTFLAGS here, the env
        # var would REPLACE those flags and break the link.
        run: >
          cargo build
          --release
          -p cellos-kernel
          --target ${{ matrix.target }}
          -Z build-std=core,alloc

      - name: Build cells + libs (release)
        env:
          # x86_64 CELLS use relocation-model=pic (build-x86_64-cells.ps1);
          # only the kernel is static/code-model=kernel. This step-level var
          # overrides the workflow-level kernel flags — harmless for the other
          # matrix rows, which never build the x86_64 target.
          CARGO_TARGET_X86_64_UNKNOWN_NONE_RUSTFLAGS: "-C relocation-model=pic"
          CC_riscv64gc_unknown_none_elf: ${{ matrix.short == 'rv64' && matrix.cc_bin || '' }}
          # littlefs2-sys also runs bindgen (for the LFS C struct layout), which
          # uses libclang independently of the CC_* override above and derives
          # its --target from the Rust target triple — pointing it at a bare
          # `-none` OS makes libclang hunt for a nonexistent sysroot instead of
          # the host's real glibc headers. Force it back to a real Linux target
          # (a header-only binding pass doesn't need the bare-metal ABI).
          BINDGEN_EXTRA_CLANG_ARGS_aarch64_unknown_none_softfloat: ${{ matrix.short == 'aarch64' && '--target=aarch64-linux-gnu --sysroot=/usr/aarch64-linux-gnu' || '' }}
          BINDGEN_EXTRA_CLANG_ARGS_x86_64_unknown_none: ${{ matrix.short == 'x86_64' && '--target=x86_64-linux-gnu' || '' }}
          # littlefs2-sys's C shim must build freestanding on every target:
          # hosted compilers default to stack-protector / libc builtins
          # (__stack_chk_fail, __popcountdi2) that a bare-metal link cannot
          # resolve, and bare-elf cross gccs ship no <string.h> (vendored
          # freestanding headers fill that). Mirrors scripts/build-*-cells.ps1.
          CFLAGS_riscv64gc_unknown_none_elf: ${{ matrix.short == 'rv64' && format('-march=rv64gc -mabi=lp64d -mcmodel=medany -ffreestanding -DLFS_NO_INTRINSICS -I{0}/third_party/freestanding-include', github.workspace) || '' }}
          CC_aarch64_unknown_none_softfloat: ${{ matrix.short == 'aarch64' && matrix.cc_bin || '' }}
          CFLAGS_aarch64_unknown_none_softfloat: ${{ matrix.short == 'aarch64' && format('-ffreestanding -fno-stack-protector -mgeneral-regs-only -DLFS_NO_INTRINSICS -I{0}/third_party/freestanding-include', github.workspace) || '' }}
          CC_x86_64_unknown_none: ${{ matrix.short == 'x86_64' && matrix.cc_bin || '' }}
          CFLAGS_x86_64_unknown_none: ${{ matrix.short == 'x86_64' && format('-ffreestanding -fno-stack-protector -mno-red-zone -mno-sse -mno-mmx -DLFS_NO_INTRINSICS -I{0}/third_party/freestanding-include', github.workspace) || '' }}
        # --exclude app-mlibc-smoke: links a pre-built mlibc libc.a
        #   (scripts/setup-mlibc.ps1 / build-mlibc.sh) that CI does not have —
        #   without it the link dies on undefined puts/printf/clock_gettime.
        # --exclude doom / tetris-c: link C objects from source clones
        #   (cells/demos/*/build.rs) that CI checkouts do not populate.
        # --exclude lua / tetris-lua: on riscv64 they link picolibc/newlib
        #   libc.a from the local xpack toolchain — Ubuntu's bare-elf gcc ships
        #   no libc.a, and newlib's locale/timelocal objects are non-PIC anyway.
        run: >
          cargo build
          --release
          ${{ matrix.cells_args }}
          --target ${{ matrix.target }}
          -Z build-std=core,alloc

      - name: Upload kernel ELF
        if: matrix.short == 'rv64'
        uses: actions/upload-artifact@v4
        with:
          name: kernel-rv64
          path: target/riscv64gc-unknown-none-elf/release/cellos-kernel
          if-no-files-found: error

      - name: Upload aarch64 kernel ELF
        if: matrix.short == 'aarch64'
        uses: actions/upload-artifact@v4
        with:
          name: kernel-aarch64
          path: target/aarch64-unknown-none-softfloat/release/cellos-kernel
          if-no-files-found: error

      - name: Upload x86_64 kernel ELF
        if: matrix.short == 'x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: kernel-x86_64
          path: target/x86_64-unknown-none/release/cellos-kernel
          if-no-files-found: error

  qemu-boot:
    name: QEMU Boot Test (512M RAM)
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU
        timeout-minutes: 10
        run: sudo apt-get update -q && sudo apt-get install -y -q qemu-system-misc

      - name: Download kernel artifact
        uses: actions/download-artifact@v4
        with:
          name: kernel-rv64
          path: target/riscv64gc-unknown-none-elf/release/

      - name: Make kernel executable
        run: chmod +x target/riscv64gc-unknown-none-elf/release/cellos-kernel

      - name: Run boot test
        # 256M: kernel is now 4.4 MB (kernel_fs.img embedded separately).
        # Checks for FAT32 mount (always present) or full shell prompt.
        run: bash scripts/qemu-boot-test.sh target/riscv64gc-unknown-none-elf/release/cellos-kernel

  c2c-broker-oracle-single-guest-local-runtime:
    name: C2C Broker Oracle (single-guest local-runtime QEMU)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # Keep evidence under RUNNER_TEMP: checkout may replace the workspace
      # before the repository exists, but the always-upload must still have a
      # diagnostic showing which setup stage did not complete.
      - name: Initialize single-guest local-runtime oracle evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/c2c-oracle-evidence"
          mkdir -p "$evidence_dir"
          {
            printf '[ci] evidence initialized before checkout and setup\n'
            printf '[ci] repository checkout starting\n'
          } > "$evidence_dir/single-guest-local-runtime-qemu.log"

      - uses: actions/checkout@v4

      - name: Record single-guest local-runtime checkout completion
        shell: bash
        run: |
          {
            printf '[ci] repository checkout completed\n'
            printf '[setup] Rust toolchain installation starting\n'
          } >> "$RUNNER_TEMP/c2c-oracle-evidence/single-guest-local-runtime-qemu.log"

      - name: Install Rust toolchain for single-guest local-runtime oracle
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-01
          components: rust-src

      - name: Record single-guest local-runtime Rust setup completion
        shell: bash
        run: |
          {
            printf '[setup] Rust toolchain installation completed\n'
            printf '[setup] Rust dependency cache setup starting\n'
          } >> "$RUNNER_TEMP/c2c-oracle-evidence/single-guest-local-runtime-qemu.log"

      - name: Cache dependencies for single-guest local-runtime oracle
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-targets: false
          key: c2c-broker-oracle-single-guest-local-runtime

      - name: Install single-guest local-runtime QEMU dependencies
        # Run 33147796277 spent 19m58s fetching 167 MB at 140 kB/s and reached
        # dpkg only as the old 20-minute limit expired. Skip QEMU's optional
        # GUI/media recommendations and leave bounded time for unpack/configure.
        timeout-minutes: 25
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/c2c-oracle-evidence/single-guest-local-runtime-qemu.log"
          printf '[setup] Rust dependency cache setup completed\n' | tee -a "$log"
          printf '[setup] apt dependency installation starting\n' | tee -a "$log"
          sudo apt-get update -q 2>&1 | tee -a "$log"
          sudo apt-get install -y -q --no-install-recommends \
            qemu-system-misc gcc-riscv64-unknown-elf libclang-dev 2>&1 | tee -a "$log"
          printf '[setup] apt dependency installation completed\n' | tee -a "$log"

      - name: Install Python cryptography for single-guest local-runtime signing
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/c2c-oracle-evidence/single-guest-local-runtime-qemu.log"
          printf '[setup] Python cryptography installation starting\n' | tee -a "$log"
          python3 -m pip install --user --quiet cryptography 2>&1 | tee -a "$log"
          printf '[setup] Python cryptography installation completed\n' | tee -a "$log"

      - name: Run single-guest local-runtime C2C broker QEMU oracle
        timeout-minutes: 40
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/c2c-oracle-evidence/single-guest-local-runtime-qemu.log"
          {
            printf '[oracle] repository runner starting\n'
            bash ./scripts/run-c2c-broker-oracle-qemu.sh
          } 2>&1 | tee -a "$log"

      - name: Upload single-guest local-runtime QEMU oracle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c2c-broker-oracle-single-guest-local-runtime-qemu-log-${{ github.run_attempt }}
          path: ${{ runner.temp }}/c2c-oracle-evidence/single-guest-local-runtime-qemu.log
          if-no-files-found: error
          retention-days: 14

  aarch64-lint:
    name: Clippy (aarch64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-01
          components: rust-src,clippy
          targets: aarch64-unknown-none-softfloat

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: aarch64-lint

      - name: Clippy (aarch64)
        run: >
          cargo clippy
          -p cellos-kernel
          --target aarch64-unknown-none-softfloat
          -Z build-std=core,alloc
          -- -D warnings

  qemu-aarch64-boot:
    name: QEMU Boot Test (aarch64)
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-01
          components: rust-src
          targets: aarch64-unknown-none-softfloat

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: aarch64-boot

      - name: Install QEMU, libclang and aarch64 sysroot
        timeout-minutes: 10
        # gcc-aarch64-linux-gnu supplies /usr/aarch64-linux-gnu — the sysroot
        # bindgen needs for aarch64 struct layouts (host glibc headers 404 on
        # bits/libc-header-start.h under --target=aarch64-linux-gnu).
        run: sudo apt-get update -q && sudo apt-get install -y -q qemu-system-arm libclang-dev gcc-aarch64-linux-gnu

      - name: Build aarch64 cells
        # clang cross-compiles the littlefs C core for the bare-metal target
        # (mirrors scripts/build-aarch64-cells.ps1); the vendored freestanding
        # headers provide <string.h>.
        env:
          CC_aarch64_unknown_none_softfloat: clang
          CFLAGS_aarch64_unknown_none_softfloat: --target=aarch64-unknown-none-elf -ffreestanding -mgeneral-regs-only -DLFS_NO_INTRINSICS -I${{ github.workspace }}/third_party/freestanding-include
          BINDGEN_EXTRA_CLANG_ARGS_aarch64_unknown_none_softfloat: --target=aarch64-linux-gnu --sysroot=/usr/aarch64-linux-gnu
        run: >
          cargo build --release
          --target aarch64-unknown-none-softfloat
          -Z build-std=core,alloc
          -p app-init -p app-shell -p service-vfs -p service-config
          -p service-net -p service-input -p service-compositor
          -p periph-demo -p input-test -p app-sys-tools

      # kernel_fs.img is a gitignored build artifact; assemble it from the
      # cells built above so the kernel embeds a real VIFS1 (build.rs would
      # otherwise stub it and the boot test could never reach the shell).
      - name: Assemble aarch64 kernel_fs.img
        # The cell list must match scripts/build-aarch64-cells.ps1, which is the
        # source of truth for what an aarch64 image carries. It had four entries
        # here against that script's eleven, so periph-demo and input-test were
        # absent and the GPIO and UART-input cases of the boot suite below could
        # only ever fail — with "shell: command not found", which reads as a shell
        # fault rather than a missing binary. The disk image is not a substitute:
        # format-disk-arm.sh writes a plain FAT volume, not the cell-store layout
        # the loader's block-table fallback reads, so on this architecture a cell
        # is reachable only from here.
        run: |
          REL=target/aarch64-unknown-none-softfloat/release
          python3 tools/mkfat32.py \
            kernel/src/embedded-aarch64/kernel_fs.img \
            "$REL/app-shell"      /bin/shell \
            "$REL/service-vfs"    /bin/vfs \
            "$REL/service-config" /bin/config \
            "$REL/service-input"  /bin/input \
            "$REL/input-test"     /bin/input-test \
            "$REL/periph-demo"    /bin/periph-demo \
            "$REL/ls"             /bin/ls \
            "$REL/cat"            /bin/cat \
            "$REL/echo"           /bin/echo \
            "$REL/ps"             /bin/ps \
            "$REL/kill"           /bin/kill
          cp "$REL/app-init" kernel/src/embedded-aarch64/init

      - name: Build aarch64 kernel
        run: >
          cargo build --release
          -p cellos-kernel
          --target aarch64-unknown-none-softfloat
          -Z build-std=core,alloc

      - name: Create aarch64 disk image
        run: bash scripts/format-disk-arm.sh disk_arm_virt.img

      - name: Boot test (aarch64)
        run: |
          chmod +x scripts/qemu-aarch64-test.sh
          BOOT_WINDOW=90 bash scripts/qemu-aarch64-test.sh

  # Tier 3b ARM64 hypervisor — two-tier lane (see
  # .agents/reports/design-260723-0709-arm64-kvm-verification-lane.md). The
  # VMM cannot be validated boot-to-shell under QEMU-TCG: TCG's software
  # composition of the guest's stage-1-over-Cellos-stage-2 page walk
  # spuriously raises an address-size fault partway through Alpine's early
  # boot relocation, even though the guest page tables and Cellos stage-2 are
  # independently provable as correct. A physical MMU doing the nested walk
  # (KVM) does not hit this. So the machinery job below runs on every PR on
  # ubuntu-24.04/TCG and asserts the VMM is healthy (tolerating exactly that
  # one documented fault signature); the boot-to-shell job asserts the full
  # "/ #" prompt but needs real ARM64+KVM hardware and stays gated off until
  # a self-hosted runner exists.
  qemu-hypervisor-machinery:
    name: QEMU Hypervisor Machinery Smoke (TCG)
    runs-on: ubuntu-24.04
    needs: build
    # Job-level: make-hypervisor-fs.sh runs its own cargo builds, so the
    # littlefs cross-compile env must cover every step, not just the explicit
    # cells step.
    env:
      CC_aarch64_unknown_none_softfloat: clang
      CFLAGS_aarch64_unknown_none_softfloat: --target=aarch64-unknown-none-elf -ffreestanding -mgeneral-regs-only -DLFS_NO_INTRINSICS -I${{ github.workspace }}/third_party/freestanding-include
      BINDGEN_EXTRA_CLANG_ARGS_aarch64_unknown_none_softfloat: --target=aarch64-linux-gnu --sysroot=/usr/aarch64-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-01
          components: rust-src
          targets: aarch64-unknown-none-softfloat

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: hypervisor-smoke

      - name: Install QEMU and aarch64 sysroot
        timeout-minutes: 10
        run: sudo apt-get update -q && sudo apt-get install -y -q qemu-system-arm libclang-dev gcc-aarch64-linux-gnu

      - name: Cache Alpine artifacts
        uses: actions/cache@v4
        with:
          path: .alpine-cache
          key: alpine-netboot-aarch64-3.21.3

      # Fetches Alpine over the network on a cache miss — acceptable for now
      # (mirrors local dev), but a pinned/mirrored artifact would remove this
      # as a source of CI flakiness if it proves unreliable.
      - name: Fetch Alpine aarch64 netboot artifacts
        run: |
          chmod +x scripts/fetch-alpine-artifacts.sh
          bash scripts/fetch-alpine-artifacts.sh .alpine-cache

      - name: Build aarch64 cells (core + hypervisor)
        run: >
          cargo build --release
          --target aarch64-unknown-none-softfloat
          -Z build-std=core,alloc
          -p app-init -p app-shell -p service-vfs -p service-config
          -p service-net -p service-hypervisor -p driver-virtio-blk

      - name: Build hypervisor kernel_fs.img (embeds Alpine)
        run: |
          chmod +x scripts/make-hypervisor-fs.sh
          bash scripts/make-hypervisor-fs.sh --skip-fetch

      - name: Build aarch64 hypervisor kernel (EMBEDDED_OVERRIDE)
        # RUSTFLAGS REPLACES the config.toml per-target flags, so it must
        # repeat +bti,+paca,+pacg alongside the kernel's relocation model.
        #
        # --features qemu-virt-1g is REQUIRED, not an optimisation: QEMU's
        # direct ELF loader does not consistently pass a DTB pointer in x0, so
        # the kernel falls back to a compile-time RAM end (boot.rs
        # FALLBACK_RAM_END). Without the feature that is 0x5000_0000 = 256 MiB;
        # the Alpine-embedding kernel itself is ~58 MiB, leaving 198 MiB usable,
        # and create_vm's 128 MiB contiguous guest carve cannot be satisfied once
        # the boot cells have fragmented it. Both run-hypervisor-arm.ps1 and
        # make-hypervisor-fs.sh document the flag for exactly this reason.
        env:
          RUSTFLAGS: "-C relocation-model=pic -C target-feature=+bti,+paca,+pacg"
          EMBEDDED_OVERRIDE: "kernel/src/embedded-hv"
        run: >
          cargo build --release
          -p cellos-kernel
          --features qemu-virt-1g
          --target aarch64-unknown-none-softfloat
          -Z build-std=core,alloc

      - name: Create hypervisor disk image
        run: |
          chmod +x scripts/format-disk-hv-arm.sh
          bash scripts/format-disk-hv-arm.sh disk_hv_arm.img

      - name: Run hypervisor machinery smoke test (TCG)
        env:
          HV_SMOKE_MODE: machinery
          BOOT_WINDOW: "120"
        run: |
          chmod +x scripts/qemu-hypervisor-smoke.sh
          bash scripts/qemu-hypervisor-smoke.sh

      # This lane fails intermittently on an unchanged source tree (docs/TODO.md).
      # The step log only holds the tail the script prints, so keep the whole
      # boot output per run — comparing a failing run against a passing one is
      # the only way to characterise the intermittency.
      - name: Upload QEMU boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hv-machinery-log-${{ github.run_attempt }}
          path: |
            qemu-hv.log
            qemu-hv.raw.log
          if-no-files-found: warn
          retention-days: 14

  # Boot-to-shell: needs real ARM64+KVM hardware (see job comment above), so it
  # stays a no-op until a self-hosted runner is registered with the `kvm`
  # label. Flip the HV_KVM_RUNNER repository variable to "true" once that
  # runner exists (Settings -> Secrets and variables -> Actions -> Variables).
  qemu-hypervisor-boot-kvm:
    name: QEMU Hypervisor Boot-to-Shell (KVM)
    if: ${{ vars.HV_KVM_RUNNER == 'true' }}
    runs-on: [self-hosted, linux, ARM64, kvm]
    needs: build
    env:
      CC_aarch64_unknown_none_softfloat: clang
      CFLAGS_aarch64_unknown_none_softfloat: --target=aarch64-unknown-none-elf -ffreestanding -mgeneral-regs-only -DLFS_NO_INTRINSICS -I${{ github.workspace }}/third_party/freestanding-include
      BINDGEN_EXTRA_CLANG_ARGS_aarch64_unknown_none_softfloat: --target=aarch64-linux-gnu --sysroot=/usr/aarch64-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-01
          components: rust-src
          targets: aarch64-unknown-none-softfloat

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: hypervisor-boot-kvm

      - name: Install QEMU and aarch64 sysroot
        timeout-minutes: 10
        run: sudo apt-get update -q && sudo apt-get install -y -q qemu-system-arm libclang-dev gcc-aarch64-linux-gnu

      - name: Cache Alpine artifacts
        uses: actions/cache@v4
        with:
          path: .alpine-cache
          key: alpine-netboot-aarch64-3.21.3

      - name: Fetch Alpine aarch64 netboot artifacts
        run: |
          chmod +x scripts/fetch-alpine-artifacts.sh
          bash scripts/fetch-alpine-artifacts.sh .alpine-cache

      - name: Build aarch64 cells (core + hypervisor)
        run: >
          cargo build --release
          --target aarch64-unknown-none-softfloat
          -Z build-std=core,alloc
          -p app-init -p app-shell -p service-vfs -p service-config
          -p service-net -p service-hypervisor

      - name: Build hypervisor kernel_fs.img (embeds Alpine)
        run: |
          chmod +x scripts/make-hypervisor-fs.sh
          bash scripts/make-hypervisor-fs.sh --skip-fetch

      - name: Build aarch64 hypervisor kernel (EMBEDDED_OVERRIDE)
        # --features qemu-virt-1g: same DTB/RAM-fallback requirement as the
        # machinery job above — see the comment there.
        env:
          RUSTFLAGS: "-C relocation-model=pic -C target-feature=+bti,+paca,+pacg"
          EMBEDDED_OVERRIDE: "kernel/src/embedded-hv"
        run: >
          cargo build --release
          -p cellos-kernel
          --features qemu-virt-1g
          --target aarch64-unknown-none-softfloat
          -Z build-std=core,alloc

      - name: Create hypervisor disk image
        run: |
          chmod +x scripts/format-disk-hv-arm.sh
          bash scripts/format-disk-hv-arm.sh disk_hv_arm.img

      - name: Run hypervisor boot-to-shell test (KVM, Alpine / # within 420s)
        env:
          HV_SMOKE_MODE: boot
          BOOT_WINDOW: "420"
        run: |
          chmod +x scripts/qemu-hypervisor-smoke.sh
          bash scripts/qemu-hypervisor-smoke.sh

      - name: Upload QEMU boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hv-boot-kvm-log-${{ github.run_attempt }}
          path: |
            qemu-hv.log
            qemu-hv.raw.log
          if-no-files-found: warn
          retention-days: 14

  x86_64-lint:
    name: Clippy (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-01
          components: rust-src,clippy
          targets: x86_64-unknown-none

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: x86_64-lint

      - name: Clippy (x86_64)
        run: >
          cargo clippy
          -p cellos-kernel
          --target x86_64-unknown-none
          -Z build-std=core,alloc
          -- -D warnings

  qemu-x86_64-boot:
    name: QEMU Boot Test (x86_64)
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-01
          components: rust-src
          targets: x86_64-unknown-none

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: x86_64-boot

      - name: Install QEMU and xorriso
        timeout-minutes: 10
        run: sudo apt-get update -q && sudo apt-get install -y -q qemu-system-x86 xorriso

      - name: Build x86_64 cells
        # Cells use relocation-model=pic (mirrors build-x86_64-cells.ps1);
        # freestanding CFLAGS keep host-cc builtins out of the bare-metal link.
        env:
          CARGO_TARGET_X86_64_UNKNOWN_NONE_RUSTFLAGS: "-C relocation-model=pic"
          CC_x86_64_unknown_none: cc
          CFLAGS_x86_64_unknown_none: -ffreestanding -fno-stack-protector -mno-red-zone -mno-sse -mno-mmx -DLFS_NO_INTRINSICS -I${{ github.workspace }}/third_party/freestanding-include
          BINDGEN_EXTRA_CLANG_ARGS_x86_64_unknown_none: --target=x86_64-linux-gnu
        run: >
          cargo build --release
          --target x86_64-unknown-none
          -Z build-std=core,alloc
          -p app-init -p app-shell -p service-vfs -p service-config
          -p service-platform -p driver-nvme -p driver-e1000 -p app-sys-tools

      # kernel_fs.img is a gitignored build artifact; the committed copy goes
      # stale against the kernel ABI — assemble a fresh one (mirrors
      # scripts/build-x86_64-cells.ps1's image layout).
      - name: Assemble x86_64 kernel_fs.img
        run: |
          REL=target/x86_64-unknown-none/release
          python3 tools/mkfat32.py \
            kernel/src/embedded-x86_64/kernel_fs.img \
            "$REL/app-shell"      /bin/shell \
            "$REL/service-vfs"    /bin/vfs \
            "$REL/service-config" /bin/config \
            "$REL/platform"       /bin/platform \
            "$REL/driver-nvme"    /bin/nvme \
            "$REL/driver-e1000"   /bin/e1000 \
            "$REL/ls"             /bin/ls \
            "$REL/cat"            /bin/cat \
            "$REL/echo"           /bin/echo \
            "$REL/ps"             /bin/ps
          cp "$REL/app-init" kernel/src/embedded-x86_64/init

      - name: Build x86_64 kernel
        run: >
          cargo build --release
          -p cellos-kernel
          --target x86_64-unknown-none
          -Z build-std=core,alloc

      - name: Build Limine ISO
        run: bash scripts/x86/make-iso-ci.sh build/vicell-x86.iso

      - name: Boot test (x86_64)
        run: |
          chmod +x scripts/qemu-x86_64-test.sh
          BOOT_WINDOW=90 bash scripts/qemu-x86_64-test.sh build/vicell-x86.iso

  vfs-quota:
    name: VFS Quota Integration Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-01
          components: rust-src

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: vfs-quota

      - name: Install dependencies
        timeout-minutes: 20
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-misc gcc-riscv64-unknown-elf libclang-dev

      # Own step, not appended to the apt install above: that step already spends its
      # whole 10-minute budget fetching gcc-riscv64-unknown-elf on a slow mirror, and
      # a timeout there must not read as a policy/signing failure.
      - name: Install Python cryptography (cell + policy signing)
        timeout-minutes: 5
        run: python3 -m pip install --user --quiet cryptography

      - name: Build test-hooks kernel
        run: |
          chmod +x scripts/build-test-hooks-ci.sh
          bash scripts/build-test-hooks-ci.sh

      - name: Run VFS quota integration test
        # tests/integration/.cargo/config.toml pins the host target to
        # x86_64-pc-windows-msvc (local dev); the env var overrides it here.
        env:
          CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
        run: cd tests/integration && cargo test --test vfs-quota

  redoxfs-srv:
