  unit-tests:
    name: Host unit tests (types + api)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-01
          components: rust-src

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Run host-side unit tests
        # libs/types, libs/api and libs/text-engine use cfg_attr(not(test), no_std)
        # and define no panic/alloc lang items, so they run on the host without a
        # bare-metal target. text-engine holds the pure grep/sed/awk/top logic that
        # app-shell cannot host-test itself (it links ostd, which owns those items).
        run: |
          cargo test -p types       --target x86_64-unknown-linux-gnu
          cargo test -p api         --target x86_64-unknown-linux-gnu
          cargo test -p text-engine --target x86_64-unknown-linux-gnu

  f1-admission:
    # Tier-1 admission gate (Spec 18 §2.1): the same `cellos-sign --check` that
    # the image scripts must pass before anything is signed. Replaces the
    # cargo-geiger gate (geiger cannot analyse `-Z build-std` bare-metal targets)
    # and the unsafe ratchet it was itself replaced by — the ratchet's rule and
    # its 49-entry Python allowlist now live in scripts/unsafe-allowlist.toml, so
    # there is exactly one implementation of "no unsafe in cells/" in the repo.
    #
    # The toolchain is installed so F5 is genuinely exercised here; --strict makes
    # a missing rustup a failure rather than a silently skipped check.
    name: F1/F5 admission check (cellos-sign --check)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-01

      # cargo-deny is deliberately NOT repeated here: the Security Scan job below
      # already runs it over the same workspace, and a second run buys nothing.
      - name: Unit-test the gate itself
        run: python3 scripts/test_cellos_sign.py

      - name: Check F1 (forbid + no unsafe outside the allowlist) and F5 (toolchain pin)
        run: python3 scripts/cellos-sign --check --strict

  shell-utils:
    name: Shell Utilities Integration Test (Phase E)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-01
          components: rust-src

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: shell-utils

      - name: Install dependencies
        timeout-minutes: 20
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q \
            qemu-system-misc gcc-riscv64-unknown-elf libclang-dev

      # Own step, not appended to the apt install above: that step already spends its
      # whole dependency-install budget fetching the cross toolchain on a slow mirror,
      # a timeout there must not read as a policy/signing failure.
      - name: Install Python cryptography (cell + policy signing)
        timeout-minutes: 5
        run: python3 -m pip install --user --quiet cryptography

      - name: Build shell-test kernel
        run: |
          chmod +x scripts/build-shell-test-ci.sh
          bash scripts/build-shell-test-ci.sh

      - name: Run shell utility integration tests
        env:
          CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
        run: cd tests/integration && cargo test --test shell-utils

  # Network data-path integration tests (DHCP → TCP → HTTP → listen/accept)
  # against the virtio-net Driver Cell. Previously the WHOLE boot suite was
  # NOT in CI, which let it rot undetected (see below). This job gates the
  # verified-green network subset so the Driver-Cell path can never silently
  # regress again. prerequisites use ci_guard(): a missing kernel/disk FAILS
  # this job instead of silently skipping every test.
  #
  # ⚠ Scoped to an ALLOWLIST, not an unfiltered `boot` suite run — so any
  # FUTURE new test starts excluded until proven 2/2, same discipline as
  # always. UPDATE (2026-07-13, .agents/260712-0901-suite-green-3arch/
  # reports/truth-matrix.md): the "~20 tests fail on drifted assertions" note
  # this used to carry is STALE — two independent fresh-image full-suite runs
  # (54 tests, --test-threads=2) both passed 53-54/54, with exactly one test
  # timing out per run (always one of network_tcp_send_recv /
  # network_curl_http_get) under TCG contention from running the whole suite
  # at once; each passed 100% in isolation and across both full runs overall.
  # The allowlist below was expanded to the full current test list on that
  # evidence. Verified only on local QEMU 10.2.0/Windows, not yet on this
  # job's ubuntu-24.04 QEMU build — first CI run after this change is the
  # verification; if a test proves flaky here that wasn't locally, remove it
  # and note why, don't silently retry until green.
  boot-suite:
    name: Network Data-Path Integration (riscv64)
    outputs:
      evidence-artifact-id: ${{ steps.upload-software-evidence.outputs.artifact-id }}
      producer-runner: ${{ steps.capture-producer.outputs.producer-runner }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-01
          components: rust-src

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: boot-suite

      - name: Install dependencies
        timeout-minutes: 20
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q \
            qemu-system-misc gcc-riscv64-unknown-elf libclang-dev

      # Own step — see the note on the other jobs' cryptography step.
      - name: Install Python cryptography (policy blob signing)
        timeout-minutes: 5
        run: python3 -m pip install --user --quiet cryptography

      - name: Prepare authenticated software evidence logs
        run: mkdir -p software-evidence

      - name: Build cells + kernel + disk images (gen_disk)
        shell: bash
        env:
          # gen_disk's cargo builds pass no --target: locally the gitignored
          # .cargo/config.toml supplies the riscv64 default; without this the
          # cells silently build for the HOST and fail to link.
          CARGO_BUILD_TARGET: riscv64gc-unknown-none-elf
          CC_riscv64gc_unknown_none_elf: riscv64-unknown-elf-gcc
          # Ubuntu's bare-elf cross gcc ships no libc headers; littlefs (via
          # service-vfs) includes <string.h> — vendored freestanding set.
          CFLAGS_riscv64gc_unknown_none_elf: -march=rv64gc -mabi=lp64d -mcmodel=medany -ffreestanding -DLFS_NO_INTRINSICS -I${{ github.workspace }}/third_party/freestanding-include
          OBJCOPY: riscv64-unknown-elf-objcopy
        run: pwsh ./gen_disk.ps1 2>&1 | tee software-evidence/gen-disk.log

      - name: Capture producer, toolchain, and disk identity
        id: capture-producer
        shell: bash
        run: |
          producer_runner="github-hosted:${RUNNER_OS}:${RUNNER_ARCH}:${ImageOS:-unknown}:${ImageVersion:-unknown}"
          {
            printf 'runner=%s\n' "$producer_runner"
            printf 'workflow_ref=%s\nrevision=%s\nsequence=%s:%s\n' \
              "$GITHUB_WORKFLOW_REF" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf '\n[rustc]\n'
            rustc --version --verbose
            printf '\n[cargo]\n'
            cargo --version --verbose
            printf '\n[qemu-system-riscv64]\n'
            qemu-system-riscv64 --version
            printf '\n[riscv64-unknown-elf-gcc]\n'
            riscv64-unknown-elf-gcc --version
            printf '\n[pwsh]\n'
            pwsh --version
          } > software-evidence/producer-metadata.log
          sha256sum disk_v3.img > software-evidence/disk-v3.sha256
          printf 'producer-runner=%s\n' "$producer_runner" >> "$GITHUB_OUTPUT"

      - name: Run boot + network + shell + VFS tests
        shell: bash
        env:
          CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
        # Allowlist by exact test-fn name (OR semantics). --test-threads=2: each
        # test boots its own QEMU and TCG is CPU-bound. 2026-07-13: expanded from
        # a 22-test subset to the full current 54-test list — two independent
        # fresh-image full-suite runs both passed 53-54/54 (see the job comment
        # above). Includes the P02 input-delivery fixes (input_keyboard_e2e,
        # input_bare_cell) and the P03 char-8-stall regression guard
        # (console_long_line_with_backspace_no_stall). Any NEW test added to
        # boot.rs after this point starts excluded until it passes 2/2
        # consecutive full runs, per the existing discipline.
        #
        # 2026-07-15: the three tests removed after the first CI execution are
        # restored — none was a QEMU-8.2 gap after all:
        #   input_keyboard_e2e        — empty-serial-in-40s was the threads=2
        #                               TCG-contention flake (same class as
        #                               network_httpd_serves_file); threads=1
        #                               resolves it.
        #   posix_shim_getentropy/net — "command not found": gen_disk never
        #                               BUILT posix-shim-test (local runs leaned
        #                               on a stale binary in target/); gen_disk
        #                               now builds it.
        # --test-threads=1: each test boots its own TCG QEMU (CPU-bound); at
        # threads=2 on the 4-vCPU runner exactly one network test times out
        # per run from contention (listen_accept / serves_file / send_recv
        # rotated across runs). Serial execution trades ~3 min of wall time
        # for determinism.
        run: |
          cd tests/integration
          cargo test --test boot -- --test-threads=1 \
            boots_to_shell_prompt fat_filesystem_mounts shell_executes_echo \
            hot_migration_state_transfer_works gpu_framebuffer_initialises \
            network_dhcp_acquires_ip network_tcp_send_recv network_curl_http_get \
            network_tcp_listen_accept \
            vfs_write_echo_redirect vfs_fat16_write_read vfs_fat16_reboot_persistence \
            vfs_write_large_content vfs_fat16_unlink vfs_fat16_subdir \
            block_io_denied_non_vfs vfs_fat16_subdir_persistence vfs_fat16_recursive_rmdir \
            vfs_fat16_append \
            network_httpd_serves_file network_httpd_dynamic_content \
            shell_while_loop shell_function_positional_args shell_case_statement \
            shell_echo_e shell_redirect_append network_wget_downloads_to_vfs \
            mqtt_publish mqtt_subscribe shell_test_builtin shell_function_define_and_call \
            shell_midtoken_var_expansion shell_unset_var shell_exit_code_var \
            shell_break_loop shell_and_operator shell_or_operator shell_for_loop \
            shell_if_true_branch shell_if_else_branch shell_variable_assignment \
            shell_variable_persists shell_source_script shell_sleep_returns \
            shell_source_multi_command shell_cmd_substitution \
            console_long_line_with_backspace_no_stall \
            input_service_registered_at_boot compositor_input_routing_active \
            bench_all_pass input_keyboard_e2e input_bare_cell \
            posix_shim_getentropy posix_shim_net \
            2>&1 | tee "$GITHUB_WORKSPACE/software-evidence/boot-suite.log"

      - name: Run compositor window-policy evidence
        shell: bash
        env:
          CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
        run: |
          cd tests/integration
          cargo test --test window-policy -- --test-threads=1 \
            clicking_exposed_surface_raises_and_focuses_its_owner \
            2>&1 | tee "$GITHUB_WORKSPACE/software-evidence/window-policy.log"

      - name: Run ViUI managed-surface evidence
        shell: bash
        env:
          CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
        run: |
          cd tests/integration
          cargo test --test viui-managed-surface -- --test-threads=1 \
            generated_counter_survives_managed_surface_configure \
            2>&1 | tee "$GITHUB_WORKSPACE/software-evidence/viui-managed-surface.log"

      - name: Upload software evidence logs
        id: upload-software-evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: software-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: software-evidence/
          if-no-files-found: error
          overwrite: false
          retention-days: 90

  security:
    name: Security Scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: cargo-deny
        # v1's bundled cargo-deny can't parse CVSS 4.0 entries now present in
        # the RustSec advisory DB ("unsupported CVSS version: 4.0"); v2 ships
        # a current cargo-deny that supports it.
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --all-features

      - name: cargo-audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  attest-catalog:
    name: Attest Authenticated Software Evidence
    needs: [lint, boot-suite]
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Download software evidence logs
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.boot-suite.outputs.evidence-artifact-id }}
          path: .authenticated-evidence/runtime
          merge-multiple: true

      - name: Validate and stage software evidence
        shell: bash
        run: |
          mkdir -p .authenticated-evidence
          python3 scripts/validate-admission-prequalification.py 2>&1 | tee .authenticated-evidence/catalog-validation.log
          python3 scripts/create-authenticated-evidence-bundle.py \
            --output evidence/manifest.json \
            --revision "${{ github.sha }}" \
            --runner "${{ needs.boot-suite.outputs.producer-runner }}" \
            --workflow-ref "${{ github.workflow_ref }}" \
            --sequence "${{ github.run_id }}:${{ github.run_attempt }}" \
            --command "boot-suite: gen_disk + boot + window-policy + viui-managed-surface" \
            --input catalog.json=scripts/admission_prequalification/catalog.json \
            --input acceptance-ledger.json=docs/app-tier-acceptance-ledger.json \
            --input workflow.yml=.github/workflows/ci.yml \
            --input gen-disk.ps1=gen_disk.ps1 \
            --input viui-managed-surface.rs=tests/integration/tests/viui-managed-surface.rs \
            --input window-policy.rs=tests/integration/tests/window-policy.rs \
            --image disk-v3.sha256=.authenticated-evidence/runtime/disk-v3.sha256 \
            --log catalog-validation.log=.authenticated-evidence/catalog-validation.log \
            --log producer-metadata.log=.authenticated-evidence/runtime/producer-metadata.log \
            --log gen-disk.log=.authenticated-evidence/runtime/gen-disk.log \
            --log boot-suite.log=.authenticated-evidence/runtime/boot-suite.log \
            --log window-policy.log=.authenticated-evidence/runtime/window-policy.log \
            --log viui-managed-surface.log=.authenticated-evidence/runtime/viui-managed-surface.log \
            --environment event_name="${{ github.event_name }}" \
            --environment ref="${{ github.ref }}" \
            --environment lint_result="${{ needs.lint.result }}" \
            --environment boot_suite_result="${{ needs.boot-suite.result }}"

      - name: Upload immutable evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          overwrite: false
          retention-days: 90

      - name: Attest Authenticated Software Evidence Bundle
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: evidence/manifest.json
