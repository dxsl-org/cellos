name: Performance Benchmarks

on:
  schedule:
    # Weekly on Sunday at 06:00 UTC
    - cron: '0 6 * * 0'
  workflow_dispatch:
    inputs:
      upload_history:
        description: 'Upload result to perf-history branch'
        required: false
        default: 'true'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Mirrors the gitignored .cargo/config.toml (see ci.yml for the full note):
  # riscv64 kernel + cells are built with relocation-model=pic.
  CARGO_TARGET_RISCV64GC_UNKNOWN_NONE_ELF_RUSTFLAGS: "-C relocation-model=pic"

jobs:
  bench:
    name: Run benchmarks (RV64)
    runs-on: ${{ vars.CI_SELF_HOSTED == 'true' && fromJSON('["self-hosted","linux","X64","cellos-ci"]') || 'ubuntu-24.04' }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-11-10
        with:
          # Pinned to the same nightly as ci.yml — an untagged `nightly` here
          # drifted ahead of the workspace and broke independently.
          toolchain: nightly-2026-05-01
          components: rust-src

      - name: Install QEMU
        timeout-minutes: 15
        uses: ./.github/actions/apt-install
        with:
          packages: qemu-system-misc

      - name: Restore perf history
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: perf-results/
          # Attempts are immutable captures; restore-keys selects prior history.
          # The rv64-v3 prefix starts the capture/v3 history (fingerprinted,
          # tier/path-labelled contract with ipc_fastpath); v2 captures are not
          # comparable and are deliberately not restored.
          key: perf-results-rv64-v3-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            perf-results-rv64-v3-

      - name: Cache Cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # service-vfs pulls littlefs2-sys, which cross-compiles vendored C —
      # same toolchain requirements as ci.yml's riscv64 jobs.
      - name: Install cross C compiler for littlefs2-sys
        timeout-minutes: 15
        uses: ./.github/actions/apt-install
        with:
          packages: gcc-riscv64-unknown-elf

      - name: Build bootstrap + bench cells
        env:
          CC_riscv64gc_unknown_none_elf: riscv64-unknown-elf-gcc
          CFLAGS_riscv64gc_unknown_none_elf: -march=rv64gc -mabi=lp64d -mcmodel=medany -ffreestanding -DLFS_NO_INTRINSICS -I${{ github.workspace }}/third_party/freestanding-include
        run: |
          cargo build --release \
            --target riscv64gc-unknown-none-elf \
            -Z build-std=core,alloc \
            -p app-init -p app-cellbox -p service-vfs -p service-config \
            -p service-platform -p driver-virtio-blk -p app-bench

      - name: Rebuild kernel with bench-aware ramdisk
        run: |
          REL=target/riscv64gc-unknown-none-elf/release
          # kernel_fs.img and init are gitignored build artifacts (the
          # directory is absent from a fresh checkout) — assemble the VIFS1
          # ramdisk from the cells built above.
          # bench + bench-probe MUST live in VIFS1: sys_spawn_pinned resolves
          # through the kernel loader (VIFS1/P2 only, no VFS).
          mkdir -p kernel/src/embedded
          cp "$REL/app-init" kernel/src/embedded/init
          python3 tools/mkfat32.py kernel/src/embedded/kernel_fs.img \
            "$REL/app-init"          /bin/init \
            "$REL/cellbox"         /bin/cellbox \
            "$REL/service-vfs"       /bin/vfs \
            "$REL/service-config"    /bin/config \
            "$REL/platform"          /bin/platform \
            "$REL/driver-virtio-blk" /bin/block \
            "$REL/bench"             /bin/bench \
            "$REL/bench-probe"       /bin/bench-probe
          EMBEDDED_OVERRIDE=kernel/src/embedded cargo build --release \
            --target riscv64gc-unknown-none-elf \
            -Z build-std=core,alloc \
            -p cellos-kernel

      - name: Generate bench disk image
        run: |
          # Cell-table-only disk retained as a hashed environment/provenance input.
          # The benchmark itself launches from VIFS1 through the normal shell path.
          bash scripts/gen-bench-disk.sh \
            target/riscv64gc-unknown-none-elf/release/bench \
            bench-disk.img

      - name: Boot QEMU and collect immutable benchmark capture
        id: bench_run
        timeout-minutes: 10
        env:
          PROFILE_ID: rv64-qemu-virt-2h-256m-v2
          CAPTURE_ID: ${{ github.run_id }}-${{ github.run_attempt }}-rv64-qemu-virt-2h-256m-v2-1
        run: |
          set -euo pipefail
          REL=target/riscv64gc-unknown-none-elf/release
          RESULT_FILE="perf-results/perf-${CAPTURE_ID}.json"
          # Publish identities before collection so the always-run validation
          # step can inspect an INVALID capture after collector failure.
          echo "capture_id=$CAPTURE_ID" >> "$GITHUB_OUTPUT"
          echo "current_capture=$RESULT_FILE" >> "$GITHUB_OUTPUT"


          # bench_results.py owns the bounded producer, unfiltered raw log,
          # producer classification, hashes, JSON serialization, and validation.
          # The collector terminates QEMU only after retaining a complete valid
          # guest record line; timeout, panic, malformed output, or early exit is invalid.
          python3 scripts/bench_results.py collect \
            --results-dir perf-results \
            --capture-id "$CAPTURE_ID" \
            --profile "$PROFILE_ID" \
            --repetition 1 \
            --repository "$GITHUB_REPOSITORY" \
            --source-ref "$GITHUB_REF" \
            --commit "$GITHUB_SHA" \
            --toolchain nightly-2026-05-01 \
            --feature release-default \
            --source-input Cargo.lock=Cargo.lock \
            --source-input rust-toolchain.toml=rust-toolchain.toml \
            --artifact kernel="$REL/cellos-kernel" \
            --artifact bench="$REL/bench" \
            --artifact probe="$REL/bench-probe" \
            --stdin-line bench \
            --stdin-after "Cellos >" \
            --artifact disk=bench-disk.img \
            --artifact ramdisk=kernel/src/embedded/kernel_fs.img \
            --timeout-seconds 300 \
            -- \
            qemu-system-riscv64 \
              -machine virt \
              -accel tcg \
              -smp 2 \
              -nographic \
              -bios default \
              -kernel "$REL/cellos-kernel" \
              -m 256M \
              -drive file=bench-disk.img,format=raw,id=hd0,if=none \
              -device virtio-blk-device,drive=hd0


      - name: Validate current capture and compare historical baseline
        if: always()
        run: |
          bash scripts/compare-bench-results.sh perf-results/ \
            --current "${{ steps.bench_run.outputs.current_capture }}" \
            --current-id "${{ steps.bench_run.outputs.capture_id }}"

      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bench-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: perf-results/
          retention-days: 90

      - name: Save perf history
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: always()
        with:
          path: perf-results/
          key: perf-results-rv64-v3-${{ github.run_id }}-${{ github.run_attempt }}

  bench-x86-tcg:
    # Functional/report-only: TCG timings never PASS or FAIL a budget, so this
    # job cannot gate. Budgets need a matched KVM baseline on a named machine
    # (scripts/x86/run-bench-x86.sh kvm on a KVM-capable runner).
    name: Run benchmarks (x86_64 TCG, report-only)
    runs-on: ${{ vars.CI_SELF_HOSTED == 'true' && fromJSON('["self-hosted","linux","X64","cellos-ci"]') || 'ubuntu-24.04' }}
    timeout-minutes: 60
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-11-10
        with:
          toolchain: nightly-2026-05-01
          components: rust-src
          targets: x86_64-unknown-none

      - name: Install QEMU and xorriso
        timeout-minutes: 15
        uses: ./.github/actions/apt-install
        with:
          packages: qemu-system-x86 xorriso

      # scripts/lib-sign-cells.sh signs every cell with the dev key through
      # `cryptography`'s Ed25519.
      - name: Install Python cryptography (cell signing)
        timeout-minutes: 5
        run: python3 scripts/ensure-ci-python-deps.py

      - name: Restore perf history
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: perf-results-x86/
          key: perf-results-x86-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            perf-results-x86-v1-

      - name: Cache Cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build x86 lifecycle image
        run: C2C_WORKLOAD=lifecycle bash scripts/build-x86_64-c2c-lifecycle-ci.sh

      - name: Boot QEMU (TCG) and collect immutable benchmark capture
        id: bench_run
        timeout-minutes: 20
        env:
          CAPTURE_ID: ${{ github.run_id }}-${{ github.run_attempt }}-x86_64-q35-2c-256m-v1-tcg-1
        run: |
          set -euo pipefail
          echo "capture_id=$CAPTURE_ID" >> "$GITHUB_OUTPUT"
          echo "current_capture=perf-results-x86/perf-${CAPTURE_ID}.json" >> "$GITHUB_OUTPUT"
          X86_BENCH_SKIP_BUILD=1 X86_BENCH_RESULTS_DIR=perf-results-x86 \
            bash scripts/x86/run-bench-x86.sh tcg "$CAPTURE_ID"

      - name: Validate current capture and report history (report-only)
        if: always()
        run: |
          bash scripts/compare-bench-results.sh perf-results-x86/ \
            --current "${{ steps.bench_run.outputs.current_capture }}" \
            --current-id "${{ steps.bench_run.outputs.capture_id }}"

      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bench-results-x86-${{ github.run_id }}-${{ github.run_attempt }}
          path: perf-results-x86/
          retention-days: 90

      - name: Save perf history
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: always()
        with:
          path: perf-results-x86/
          key: perf-results-x86-v1-${{ github.run_id }}-${{ github.run_attempt }}

