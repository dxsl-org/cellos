name: Performance Benchmarks

on:
  schedule:
    # Weekly on Sunday at 06:00 UTC
    - cron: '0 6 * * 0'
  workflow_dispatch:
    inputs:
      upload_history:
        description: 'Upload result to perf-history branch'
        required: false
        default: 'true'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Mirrors the gitignored .cargo/config.toml (see ci.yml for the full note):
  # riscv64 kernel + cells are built with relocation-model=pic.
  CARGO_TARGET_RISCV64GC_UNKNOWN_NONE_ELF_RUSTFLAGS: "-C relocation-model=pic"

jobs:
  bench:
    name: Run benchmarks (RV64)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          # Pinned to the same nightly as ci.yml — an untagged `nightly` here
          # drifted ahead of the workspace and broke independently.
          toolchain: nightly-2026-05-01
          components: rust-src

      - name: Install QEMU
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-misc

      - name: Restore perf history
        uses: actions/cache/restore@v4
        with:
          path: perf-results/
          # Attempts are immutable captures; restore-keys selects prior history.
          key: perf-results-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            perf-results-

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # service-vfs pulls littlefs2-sys, which cross-compiles vendored C —
      # same toolchain requirements as ci.yml's riscv64 jobs.
      - name: Install cross C compiler for littlefs2-sys
        timeout-minutes: 10
        run: sudo apt-get update -q && sudo apt-get install -y -q gcc-riscv64-unknown-elf

      - name: Build bootstrap + bench cells
        env:
          CC_riscv64gc_unknown_none_elf: riscv64-unknown-elf-gcc
          CFLAGS_riscv64gc_unknown_none_elf: -march=rv64gc -mabi=lp64d -mcmodel=medany -ffreestanding -DLFS_NO_INTRINSICS -I${{ github.workspace }}/third_party/freestanding-include
        run: |
          cargo build --release \
            --target riscv64gc-unknown-none-elf \
            -Z build-std=core,alloc \
            -p app-init -p app-shell -p service-vfs -p service-config \
            -p service-platform -p driver-virtio-blk -p app-bench

      - name: Rebuild kernel with bench-aware ramdisk
        run: |
          REL=target/riscv64gc-unknown-none-elf/release
          # kernel_fs.img is a gitignored build artifact (only init is
          # committed) — assemble the VIFS1 ramdisk from the cells built above.
          # bench + bench-probe MUST live in VIFS1: sys_spawn_pinned resolves
          # through the kernel loader (VIFS1/P2 only, no VFS).
          cp "$REL/app-init" kernel/src/embedded/init
          python3 tools/mkfat32.py kernel/src/embedded/kernel_fs.img \
            "$REL/app-init"          /bin/init \
            "$REL/app-shell"         /bin/shell \
            "$REL/service-vfs"       /bin/vfs \
            "$REL/service-config"    /bin/config \
            "$REL/platform"          /bin/platform \
            "$REL/driver-virtio-blk" /bin/block \
            "$REL/bench"             /bin/bench \
            "$REL/bench-probe"       /bin/bench-probe
          cargo build --release \
            --target riscv64gc-unknown-none-elf \
            -Z build-std=core,alloc \
            -p cellos-kernel

      - name: Generate bench disk image
        run: |
          # Cell-table-only disk retained as a hashed environment/provenance input.
          # The benchmark itself launches from VIFS1 through the normal shell path.
          bash scripts/gen-bench-disk.sh \
            target/riscv64gc-unknown-none-elf/release/bench \
            bench-disk.img

      - name: Boot QEMU and collect immutable benchmark capture
        id: bench_run
        timeout-minutes: 10
        env:
          PROFILE_ID: rv64-qemu-virt-2h-256m-v2
          CAPTURE_ID: ${{ github.run_id }}-${{ github.run_attempt }}-rv64-qemu-virt-2h-256m-v2-1
        run: |
          set -euo pipefail
          REL=target/riscv64gc-unknown-none-elf/release
          RESULT_FILE="perf-results/perf-${CAPTURE_ID}.json"
          # Publish identities before collection so the always-run validation
          # step can inspect an INVALID capture after collector failure.
          echo "capture_id=$CAPTURE_ID" >> "$GITHUB_OUTPUT"
          echo "current_capture=$RESULT_FILE" >> "$GITHUB_OUTPUT"


          # bench_results.py owns the bounded producer, unfiltered raw log,
          # producer classification, hashes, JSON serialization, and validation.
          # The collector terminates QEMU only after retaining a complete valid
          # guest record line; timeout, panic, malformed output, or early exit is invalid.
          python3 scripts/bench_results.py collect \
            --results-dir perf-results \
            --capture-id "$CAPTURE_ID" \
            --profile "$PROFILE_ID" \
            --repetition 1 \
            --repository "$GITHUB_REPOSITORY" \
            --source-ref "$GITHUB_REF" \
            --commit "$GITHUB_SHA" \
            --toolchain nightly-2026-05-01 \
            --feature release-default \
            --source-input Cargo.lock=Cargo.lock \
            --source-input rust-toolchain.toml=rust-toolchain.toml \
            --artifact kernel="$REL/cellos-kernel" \
            --artifact bench="$REL/bench" \
            --artifact probe="$REL/bench-probe" \
            --stdin-line bench \
            --stdin-after "Cellos >" \
            --artifact disk=bench-disk.img \
            --artifact ramdisk=kernel/src/embedded/kernel_fs.img \
            --timeout-seconds 300 \
            -- \
            qemu-system-riscv64 \
              -machine virt \
              -accel tcg \
              -smp 2 \
              -nographic \
              -bios default \
              -kernel "$REL/cellos-kernel" \
              -m 256M \
              -drive file=bench-disk.img,format=raw,id=hd0,if=none \
              -device virtio-blk-device,drive=hd0


      - name: Validate current capture and compare historical baseline
        if: always()
        run: |
          bash scripts/compare-bench-results.sh perf-results/ \
            --current "${{ steps.bench_run.outputs.current_capture }}" \
            --current-id "${{ steps.bench_run.outputs.capture_id }}"

      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: perf-results/
          retention-days: 90

      - name: Save perf history
        uses: actions/cache/save@v4
        if: always()
        with:
          path: perf-results/
          key: perf-results-${{ github.run_id }}-${{ github.run_attempt }}

