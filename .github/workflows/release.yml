name: Release

on:
  push:
    tags: ['v*']

# Every job reads only; the publishing job alone widens to contents: write.
permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  # Mirrors ci.yml / .cargo/config.toml (gitignored): the riscv64 kernel
  # self-relocates through the GOT and must be built pic.
  CARGO_TARGET_RISCV64GC_UNKNOWN_NONE_ELF_RUSTFLAGS: "-C relocation-model=pic"

jobs:
  build-kernel:
    name: Build release kernel (RV64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-05-01
          components: rust-src
          targets: riscv64gc-unknown-none-elf
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with: { cache-on-failure: true }
      # All three anchors (cell signing, fleet policy, owner admission) come from
      # secrets as 64 hex characters; build.rs refuses a missing, zero or dev key.
      - name: Provision release public keys
        env:
          CELL_HEX: ${{ secrets.CELLOS_RELEASE_CELL_PUBLIC_KEY }}
          POLICY_HEX: ${{ secrets.CELLOS_RELEASE_POLICY_PUBLIC_KEY }}
          OWNER_HEX: ${{ secrets.CELLOS_RELEASE_OWNER_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          for pair in CELL:"$CELL_HEX" POLICY:"$POLICY_HEX" OWNER:"$OWNER_HEX"; do
            name="${pair%%:*}"; hex="${pair#*:}"
            if [ -z "$hex" ]; then
              echo "::error::secret CELLOS_RELEASE_${name}_PUBLIC_KEY is empty; a release kernel needs every trust anchor"
              exit 1
            fi
            key_file="$RUNNER_TEMP/release-${name,,}.pub"
            printf '%s' "$hex" | python3 -c '
          import sys
          key = bytes.fromhex(sys.stdin.read().strip())
          if len(key) != 32:
              sys.exit("release public key must be 64 hex characters (32 bytes)")
          open(sys.argv[1], "wb").write(key)
          ' "$key_file"
            echo "CELLOS_RELEASE_${name}_PUBLIC_KEY=$key_file" >> "$GITHUB_ENV"
          done
      # release-posture = release-signing-key + signing-required + policy-required.
      # --no-default-features drops dev-policy-key, dev-signing-key and dev-weak-rng.
      - name: Build kernel (RV64, release posture)
        run: >
          cargo build --release
          -p cellos-kernel
          --target riscv64gc-unknown-none-elf
          -Z build-std=core,alloc
          --no-default-features
          --features release-posture
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cellos-kernel-riscv64
          path: target/riscv64gc-unknown-none-elf/release/cellos-kernel
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build-kernel
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-05-01
      - name: Install git-cliff
        run: cargo install --locked git-cliff --version 2.14.2
      - name: Generate CHANGELOG for this tag
        run: git-cliff --current > RELEASE_NOTES.md
      - name: Update full CHANGELOG.md
        run: |
          git-cliff --output CHANGELOG.md
          git config user.name "DXSL"
          git config user.email "ci@vios"
          git add CHANGELOG.md
          git commit -m "chore(release): update CHANGELOG" || true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cellos-kernel-riscv64
          path: dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: RELEASE_NOTES.md
          files: dist/cellos-kernel
