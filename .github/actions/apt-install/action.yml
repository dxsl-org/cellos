name: apt-install
description: >
  Install Ubuntu packages for a CI job. On GitHub-hosted runners the .deb
  closure is cached per runner image, each network attempt is time-boxed, and a
  slow default mirror falls back to archive.ubuntu.com once. On self-hosted
  runners nothing is installed (the runner account has no sudo): the step only
  verifies the packages are present and fails naming the missing ones.
inputs:
  packages:
    description: Space-separated Debian package names.
    required: true
  no-install-recommends:
    description: Pass --no-install-recommends to apt-get install.
    default: "false"
runs:
  using: composite
  steps:
    - name: Verify packages (self-hosted)
      if: runner.environment != 'github-hosted'
      shell: bash
      env:
        APT_PACKAGES: ${{ inputs.packages }}
      run: bash "$GITHUB_ACTION_PATH/apt-install.sh" check

    - name: Compute .deb cache key
      id: key
      if: runner.environment == 'github-hosted'
      shell: bash
      env:
        APT_PACKAGES: ${{ inputs.packages }}
      run: bash "$GITHUB_ACTION_PATH/apt-install.sh" key >> "$GITHUB_OUTPUT"

    - name: Restore .deb cache
      id: restore
      if: runner.environment == 'github-hosted'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.cache/apt-debs
        key: ${{ steps.key.outputs.key }}

    - name: Install packages
      if: runner.environment == 'github-hosted'
      shell: bash
      env:
        APT_PACKAGES: ${{ inputs.packages }}
        APT_NO_RECOMMENDS: ${{ inputs.no-install-recommends }}
      run: bash "$GITHUB_ACTION_PATH/apt-install.sh" install

    - name: Save .deb cache
      if: runner.environment == 'github-hosted' && steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.cache/apt-debs
        key: ${{ steps.key.outputs.key }}
