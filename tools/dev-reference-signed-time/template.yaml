{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Description": "Non-deploying SOFTWARE_HARNESS graph for the CellOS DEV_REFERENCE signed-time service.",
  "Metadata": {
    "CellOSArchitecture": {
      "Classification": "SOFTWARE_HARNESS",
      "Deployable": false,
      "LiveIsolationClaim": false,
      "ArtifactContract": "A prebuilt, approved, code-signed S3 object and its exact CodeSha256 must be supplied; this template does not build, package, select, or approve code.",
      "CompositionLimitation": "The generic runtime composition is SOFTWARE_HARNESS only; no deployable artifact exists until an operator supplies the reviewed canonical manifest and approved local dependency wheelhouse.",
      "SignerApprovalEvidence": "The profile version remains pinned in the CodeSigningConfig. Immutable version approval and artifact-to-profile evidence are external requirements; the approval role can inspect only the derived unversioned profile.",
      "ExternalControlsRequired": [
        "Externally administered permissions boundary and SCP",
        "Separated CloudFormation service role",
        "Exact separately controlled key-policy administrator role",
        "Independent code-sign approval",
        "Operator authorization and retained negative-probe evidence"
      ],
      "EvidenceRequirement": "This mutable template declares intended resources and roles only. The exact separately controlled key-policy administrator must remain available, and the launch role, boundary and SCP contents plus live direct and indirect kms:Sign isolation must be proven outside this stack before deployment or acceptance."
    }
  },
  "Parameters": {
    "ArtifactS3Bucket": {
      "Type": "String",
      "Description": "Existing bucket containing the approved code-signed ZIP artifact.",
      "MinLength": 3,
      "MaxLength": 63,
      "AllowedPattern": "^(?!xn--)(?!.*\\.\\.)(?!.*\\.-)(?!.*-\\.)(?!\\d{1,3}(?:\\.\\d{1,3}){3}$)[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
    },
    "ArtifactS3Key": {
      "Type": "String",
      "Description": "Exact existing S3 key for the approved code-signed ZIP artifact.",
      "MinLength": 1,
      "MaxLength": 1024,
      "AllowedPattern": "^(?!/)(?!.*//)[A-Za-z0-9!_.*'()/-]+$"
    },
    "ArtifactS3ObjectVersion": {
      "Type": "String",
      "Description": "Exact immutable S3 object version for the approved artifact.",
      "MinLength": 1,
      "MaxLength": 1024,
      "AllowedPattern": "^[A-Za-z0-9._~+/=-]+$"
    },
    "CodeSha256": {
      "Type": "String",
      "Description": "Exact base64-encoded SHA-256 digest of the approved ZIP artifact.",
      "AllowedPattern": "^[A-Za-z0-9+/]{43}=$",
      "MinLength": 44,
      "MaxLength": 44
    },
    "SignerProfileVersionArn": {
      "Type": "String",
      "Description": "Exact pre-existing AWS Signer signing-profile version ARN approved for this artifact.",
      "AllowedPattern": "^arn:(aws|aws-us-gov|aws-cn):signer:[a-z0-9-]+:[0-9]{12}:/signing-profiles/[A-Za-z0-9_-]{2,64}/[A-Za-z0-9_-]{1,64}$",
      "MinLength": 35,
      "MaxLength": 1024
    },
    "ExternalPermissionsBoundaryArn": {
      "Type": "String",
      "Description": "Externally administered permissions boundary; its deny semantics cannot be proven by this template.",
      "AllowedPattern": "^arn:(aws|aws-us-gov|aws-cn):iam::[0-9]{12}:policy/[A-Za-z0-9+=,.@_/-]{1,128}$"
    },
    "CloudFormationServiceRoleArn": {
      "Type": "String",
      "Description": "Pre-existing separated CloudFormation service role governed outside this stack.",
      "AllowedPattern": "^arn:(aws|aws-us-gov|aws-cn):iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]{1,128}$"
    },
    "DeployTrustedPrincipalArn": {
      "Type": "String",
      "Description": "Exact external role allowed to assume the separated deploy role.",
      "AllowedPattern": "^arn:(aws|aws-us-gov|aws-cn):iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]{1,128}$"
    },
    "CodeSignTrustedPrincipalArn": {
      "Type": "String",
      "Description": "Exact external role allowed to assume the separated code-sign approval role.",
      "AllowedPattern": "^arn:(aws|aws-us-gov|aws-cn):iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]{1,128}$"
    },
    "IamTrustedPrincipalArn": {
      "Type": "String",
      "Description": "Exact external role allowed to assume the separated IAM review role.",
      "AllowedPattern": "^arn:(aws|aws-us-gov|aws-cn):iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]{1,128}$"
    },
    "KeyPolicyTrustedPrincipalArn": {
      "Type": "String",
      "Description": "Exact external role allowed to assume the separated key-policy administration role.",
      "AllowedPattern": "^arn:(aws|aws-us-gov|aws-cn):iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]{1,128}$"
    },
    "LineageTransitionTrustedPrincipalArn": {
      "Type": "String",
      "Description": "Exact external role allowed to assume the allocator-lineage transition role.",
      "AllowedPattern": "^arn:(aws|aws-us-gov|aws-cn):iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]{1,128}$"
    },
    "AlarmTopicArn": {
      "Type": "String",
      "Description": "Exact pre-existing operator-approved SNS topic ARN for all harness alarms.",
      "AllowedPattern": "^arn:(aws|aws-us-gov|aws-cn):sns:[a-z0-9-]+:[0-9]{12}:[A-Za-z0-9_-]{1,256}$"
    }
  },
  "Rules": {
    "SeparatedExternalPrincipals": {
      "Assertions": [
        {"Assert": {"Fn::Not": [{"Fn::Equals": [{"Ref": "DeployTrustedPrincipalArn"}, {"Ref": "CodeSignTrustedPrincipalArn"}]}]}, "AssertDescription": "Deploy and code-sign principals must differ."},
        {"Assert": {"Fn::Not": [{"Fn::Equals": [{"Ref": "DeployTrustedPrincipalArn"}, {"Ref": "IamTrustedPrincipalArn"}]}]}, "AssertDescription": "Deploy and IAM principals must differ."},
        {"Assert": {"Fn::Not": [{"Fn::Equals": [{"Ref": "DeployTrustedPrincipalArn"}, {"Ref": "KeyPolicyTrustedPrincipalArn"}]}]}, "AssertDescription": "Deploy and key-policy principals must differ."},
        {"Assert": {"Fn::Not": [{"Fn::Equals": [{"Ref": "CodeSignTrustedPrincipalArn"}, {"Ref": "IamTrustedPrincipalArn"}]}]}, "AssertDescription": "Code-sign and IAM principals must differ."},
        {"Assert": {"Fn::Not": [{"Fn::Equals": [{"Ref": "CodeSignTrustedPrincipalArn"}, {"Ref": "KeyPolicyTrustedPrincipalArn"}]}]}, "AssertDescription": "Code-sign and key-policy principals must differ."},
        {"Assert": {"Fn::Not": [{"Fn::Equals": [{"Ref": "IamTrustedPrincipalArn"}, {"Ref": "KeyPolicyTrustedPrincipalArn"}]}]}, "AssertDescription": "IAM and key-policy principals must differ."},
        {"Assert": {"Fn::Not": [{"Fn::Equals": [{"Ref": "CloudFormationServiceRoleArn"}, {"Ref": "DeployTrustedPrincipalArn"}]}]}, "AssertDescription": "CloudFormation service role and deploy principal must differ."},
        {"Assert": {"Fn::Not": [{"Fn::Equals": [{"Ref": "CloudFormationServiceRoleArn"}, {"Ref": "CodeSignTrustedPrincipalArn"}]}]}, "AssertDescription": "CloudFormation service role and code-sign principal must differ."},
        {"Assert": {"Fn::Not": [{"Fn::Equals": [{"Ref": "CloudFormationServiceRoleArn"}, {"Ref": "IamTrustedPrincipalArn"}]}]}, "AssertDescription": "CloudFormation service role and IAM principal must differ."},
        {"Assert": {"Fn::Not": [{"Fn::Equals": [{"Ref": "CloudFormationServiceRoleArn"}, {"Ref": "KeyPolicyTrustedPrincipalArn"}]}]}, "AssertDescription": "CloudFormation service role and key-policy principal must differ."},
        {"Assert": {"Fn::Not": [{"Fn::Equals": [{"Ref": "LineageTransitionTrustedPrincipalArn"}, {"Ref": "DeployTrustedPrincipalArn"}]}]}, "AssertDescription": "Lineage-transition and deploy principals must differ."},
        {"Assert": {"Fn::Not": [{"Fn::Equals": [{"Ref": "LineageTransitionTrustedPrincipalArn"}, {"Ref": "CodeSignTrustedPrincipalArn"}]}]}, "AssertDescription": "Lineage-transition and code-sign principals must differ."},
        {"Assert": {"Fn::Not": [{"Fn::Equals": [{"Ref": "LineageTransitionTrustedPrincipalArn"}, {"Ref": "IamTrustedPrincipalArn"}]}]}, "AssertDescription": "Lineage-transition and IAM principals must differ."},
        {"Assert": {"Fn::Not": [{"Fn::Equals": [{"Ref": "LineageTransitionTrustedPrincipalArn"}, {"Ref": "KeyPolicyTrustedPrincipalArn"}]}]}, "AssertDescription": "Lineage-transition and key-policy principals must differ."},
        {"Assert": {"Fn::Not": [{"Fn::Equals": [{"Ref": "LineageTransitionTrustedPrincipalArn"}, {"Ref": "CloudFormationServiceRoleArn"}]}]}, "AssertDescription": "Lineage-transition principal and CloudFormation service role must differ."}
      ]
    }
  },
  "Resources": {
    "SignedTimeTable": {
      "Type": "AWS::DynamoDB::Table",
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Properties": {
        "TableName": "cellos-dev-reference-signed-time",
        "BillingMode": "PAY_PER_REQUEST",
        "AttributeDefinitions": [{"AttributeName": "pk", "AttributeType": "S"}],
        "KeySchema": [{"AttributeName": "pk", "KeyType": "HASH"}],
        "DeletionProtectionEnabled": true,
        "PointInTimeRecoverySpecification": {
          "PointInTimeRecoveryEnabled": true,
          "RecoveryPeriodInDays": 35
        },
        "SSESpecification": {
          "SSEEnabled": true,
          "SSEType": "KMS"
        }
      }
    },
    "LineageTable": {
      "Type": "AWS::DynamoDB::Table",
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Properties": {
        "TableName": "cellos-dev-reference-signed-time-lineage",
        "BillingMode": "PAY_PER_REQUEST",
        "AttributeDefinitions": [{"AttributeName": "pk", "AttributeType": "S"}],
        "KeySchema": [{"AttributeName": "pk", "KeyType": "HASH"}],
        "DeletionProtectionEnabled": true,
        "PointInTimeRecoverySpecification": {
          "PointInTimeRecoveryEnabled": true,
          "RecoveryPeriodInDays": 35
        },
        "SSESpecification": {
          "SSEEnabled": true,
          "SSEType": "KMS"
        }
      }
    },
    "RuntimeRole": {
      "Type": "AWS::IAM::Role",
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Properties": {
        "RoleName": "cellos-dev-reference-signed-time-runtime",
        "PermissionsBoundary": {"Ref": "ExternalPermissionsBoundaryArn"},
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [{
            "Sid": "OnlyLambdaService",
            "Effect": "Allow",
            "Principal": {"Service": "lambda.amazonaws.com"},
            "Action": "sts:AssumeRole"
          }]
        },
        "Policies": [{
          "PolicyName": "exact-table-and-function-log-group",
          "PolicyDocument": {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Sid": "ExactAllocatorTransactionReads",
                "Effect": "Allow",
                "Action": "dynamodb:GetItem",
                "Resource": {"Fn::GetAtt": ["SignedTimeTable", "Arn"]},
                "Condition": {
                  "ForAnyValue:StringEquals": {
                    "dynamodb:EnclosingOperation": ["TransactGetItems"]
                  }
                }
              },
              {
                "Sid": "ExactAllocatorTransactionWrites",
                "Effect": "Allow",
                "Action": ["dynamodb:ConditionCheckItem", "dynamodb:PutItem"],
                "Resource": {"Fn::GetAtt": ["SignedTimeTable", "Arn"]},
                "Condition": {
                  "ForAnyValue:StringEquals": {
                    "dynamodb:EnclosingOperation": ["TransactWriteItems"]
                  }
                }
              },
              {
                "Sid": "ExactLineageTransactionReads",
                "Effect": "Allow",
                "Action": "dynamodb:GetItem",
                "Resource": {"Fn::GetAtt": ["LineageTable", "Arn"]},
                "Condition": {
                  "ForAnyValue:StringEquals": {
                    "dynamodb:EnclosingOperation": ["TransactGetItems"]
                  }
                }
              },
              {
                "Sid": "ExactLineageTransactionChecks",
                "Effect": "Allow",
                "Action": "dynamodb:ConditionCheckItem",
                "Resource": {"Fn::GetAtt": ["LineageTable", "Arn"]},
                "Condition": {
                  "ForAnyValue:StringEquals": {
                    "dynamodb:EnclosingOperation": ["TransactWriteItems"]
                  }
                }
              },
              {
                "Sid": "ExactTableIdentityReads",
                "Effect": "Allow",
                "Action": "dynamodb:DescribeTable",
                "Resource": [
                  {"Fn::GetAtt": ["SignedTimeTable", "Arn"]},
                  {"Fn::GetAtt": ["LineageTable", "Arn"]}
                ]
              },
              {
                "Sid": "ExactFunctionLogGroupStreams",
                "Effect": "Allow",
                "Action": ["logs:CreateLogStream", "logs:PutLogEvents"],
                "Resource": {
                  "Fn::Sub": [
                    "${LogGroupArn}:*",
                    {"LogGroupArn": {"Fn::GetAtt": ["FunctionLogGroup", "Arn"]}}
                  ]
                }
              }
            ]
          }
        }]
      }
    },
    "DeployAdminRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "RoleName": "cellos-dev-reference-signed-time-deploy-admin",
        "PermissionsBoundary": {"Ref": "ExternalPermissionsBoundaryArn"},
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [{
            "Sid": "ExactExternalPrincipal",
            "Effect": "Allow",
            "Principal": {"AWS": {"Ref": "DeployTrustedPrincipalArn"}},
            "Action": "sts:AssumeRole",
            "Condition": {"ArnEquals": {"aws:PrincipalArn": {"Ref": "DeployTrustedPrincipalArn"}}}
          }]
        },
        "Policies": [
          {
            "PolicyName": "fail-closed-signing-reachability-guardrails",
            "PolicyDocument": {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Sid": "DenyDirectCodeIamAndKeyPolicyMutation",
                  "Effect": "Deny",
                  "Action": [
                    "lambda:UpdateFunctionCode", "lambda:UpdateFunctionConfiguration", "lambda:DeleteFunction",
                    "lambda:PutFunctionCodeSigningConfig", "lambda:DeleteFunctionCodeSigningConfig", "lambda:PublishVersion",
                    "lambda:CreateAlias", "lambda:UpdateAlias", "lambda:DeleteAlias", "lambda:AddPermission", "lambda:RemovePermission",
                    "lambda:PutFunctionConcurrency", "lambda:DeleteFunctionConcurrency",
                    "lambda:PutFunctionEventInvokeConfig", "lambda:UpdateFunctionEventInvokeConfig", "lambda:DeleteFunctionEventInvokeConfig",
                    "iam:CreateRole", "iam:DeleteRole", "iam:UpdateRole", "iam:UpdateAssumeRolePolicy",
                    "iam:PutRolePolicy", "iam:DeleteRolePolicy", "iam:AttachRolePolicy", "iam:DetachRolePolicy",
                    "iam:TagRole", "iam:UntagRole", "iam:CreatePolicy", "iam:CreatePolicyVersion",
                    "iam:SetDefaultPolicyVersion", "iam:DeletePolicy", "iam:DeletePolicyVersion",
                    "kms:Sign", "kms:CreateGrant", "kms:RetireGrant", "kms:RevokeGrant", "kms:PutKeyPolicy"
                  ],
                  "Resource": "*"
                },
                {
                  "Sid": "DenyRuntimeAssumptionAndDelegation",
                  "Effect": "Deny",
                  "Action": ["sts:AssumeRole", "iam:PassRole"],
                  "Resource": {"Fn::GetAtt": ["RuntimeRole", "Arn"]}
                },
                {
                  "Sid": "DenyPostBootstrapStackCreation",
                  "Effect": "Deny",
                  "Action": "cloudformation:CreateStack",
                  "Resource": "*"
                },
                {
                  "Sid": "DenyUnseparatedCloudFormationMutation",
                  "Effect": "Deny",
                  "Action": ["cloudformation:UpdateStack", "cloudformation:CreateChangeSet"],
                  "Resource": "*",
                  "Condition": {"StringNotEquals": {"cloudformation:RoleArn": {"Ref": "CloudFormationServiceRoleArn"}}}
                }
              ]
            }
          },
          {
            "PolicyName": "narrow-current-stack-update",
            "PolicyDocument": {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Sid": "UpdateCurrentStackThroughSeparatedServiceRole",
                  "Effect": "Allow",
                  "Action": ["cloudformation:UpdateStack", "cloudformation:CreateChangeSet"],
                  "Resource": {"Ref": "AWS::StackId"},
                  "Condition": {"StringEquals": {"cloudformation:RoleArn": {"Ref": "CloudFormationServiceRoleArn"}}}
                },
                {
                  "Sid": "InspectCurrentStack",
                  "Effect": "Allow",
                  "Action": ["cloudformation:DescribeStacks", "cloudformation:GetTemplate"],
                  "Resource": {"Ref": "AWS::StackId"}
                },
                {
                  "Sid": "OperateOnlyDeterministicallyNamedChangeSets",
                  "Effect": "Allow",
                  "Action": ["cloudformation:DescribeChangeSet", "cloudformation:DeleteChangeSet", "cloudformation:ExecuteChangeSet"],
                  "Resource": {"Fn::Sub": "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/cellos-dev-reference-signed-time-*/*"}
                },
                {
                  "Sid": "PassOnlySeparatedCloudFormationServiceRole",
                  "Effect": "Allow",
                  "Action": "iam:PassRole",
                  "Resource": {"Ref": "CloudFormationServiceRoleArn"},
                  "Condition": {"StringEquals": {"iam:PassedToService": "cloudformation.amazonaws.com"}}
                }
              ]
            }
          }
        ]
      }
    },
    "CodeSignApprovalRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "RoleName": "cellos-dev-reference-signed-time-code-sign-approval",
        "PermissionsBoundary": {"Ref": "ExternalPermissionsBoundaryArn"},
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [{
            "Sid": "ExactExternalPrincipal",
            "Effect": "Allow",
            "Principal": {"AWS": {"Ref": "CodeSignTrustedPrincipalArn"}},
            "Action": "sts:AssumeRole",
            "Condition": {"ArnEquals": {"aws:PrincipalArn": {"Ref": "CodeSignTrustedPrincipalArn"}}}
          }]
        },
        "Policies": [
          {
            "PolicyName": "fail-closed-signing-reachability-guardrails",
            "PolicyDocument": {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Sid": "DenyDirectCodeIamAndKeyPolicyMutation",
                  "Effect": "Deny",
                  "Action": [
                    "lambda:UpdateFunctionCode", "lambda:UpdateFunctionConfiguration", "lambda:DeleteFunction",
                    "lambda:PutFunctionCodeSigningConfig", "lambda:DeleteFunctionCodeSigningConfig", "lambda:PublishVersion",
                    "lambda:CreateAlias", "lambda:UpdateAlias", "lambda:DeleteAlias", "lambda:AddPermission", "lambda:RemovePermission",
                    "lambda:PutFunctionConcurrency", "lambda:DeleteFunctionConcurrency",
                    "lambda:PutFunctionEventInvokeConfig", "lambda:UpdateFunctionEventInvokeConfig", "lambda:DeleteFunctionEventInvokeConfig",
                    "iam:CreateRole", "iam:DeleteRole", "iam:UpdateRole", "iam:UpdateAssumeRolePolicy",
                    "iam:PutRolePolicy", "iam:DeleteRolePolicy", "iam:AttachRolePolicy", "iam:DetachRolePolicy",
                    "iam:TagRole", "iam:UntagRole", "iam:CreatePolicy", "iam:CreatePolicyVersion",
                    "iam:SetDefaultPolicyVersion", "iam:DeletePolicy", "iam:DeletePolicyVersion",
                    "kms:Sign", "kms:CreateGrant", "kms:RetireGrant", "kms:RevokeGrant", "kms:PutKeyPolicy"
                  ],
                  "Resource": "*"
                },
                {
                  "Sid": "DenyRuntimeAssumptionAndDelegation",
                  "Effect": "Deny",
                  "Action": ["sts:AssumeRole", "iam:PassRole"],
                  "Resource": {"Fn::GetAtt": ["RuntimeRole", "Arn"]}
                },
                {
                  "Sid": "DenyAllIndirectStackMutation",
                  "Effect": "Deny",
                  "Action": ["cloudformation:CreateStack", "cloudformation:UpdateStack", "cloudformation:CreateChangeSet", "cloudformation:ExecuteChangeSet"],
                  "Resource": "*"
                }
              ]
            }
          },
          {
            "PolicyName": "inspect-approved-signer-profile",
            "PolicyDocument": {
              "Version": "2012-10-17",
              "Statement": [{
                "Sid": "InspectOnlyApprovedProfile",
                "Effect": "Allow",
                "Action": "signer:GetSigningProfile",
                "Resource": {
                  "Fn::Join": [
                    "/",
                    [
                      {"Fn::Select": [0, {"Fn::Split": ["/", {"Ref": "SignerProfileVersionArn"}]}]},
                      {"Fn::Select": [1, {"Fn::Split": ["/", {"Ref": "SignerProfileVersionArn"}]}]},
                      {"Fn::Select": [2, {"Fn::Split": ["/", {"Ref": "SignerProfileVersionArn"}]}]}
                    ]
                  ]
                }
              }]
            }
          }
        ]
      }
    },
    "IamReviewRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "RoleName": "cellos-dev-reference-signed-time-iam-review",
        "PermissionsBoundary": {"Ref": "ExternalPermissionsBoundaryArn"},
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [{
            "Sid": "ExactExternalPrincipal",
            "Effect": "Allow",
            "Principal": {"AWS": {"Ref": "IamTrustedPrincipalArn"}},
            "Action": "sts:AssumeRole",
            "Condition": {"ArnEquals": {"aws:PrincipalArn": {"Ref": "IamTrustedPrincipalArn"}}}
          }]
        },
        "Policies": [
          {
            "PolicyName": "fail-closed-signing-reachability-guardrails",
            "PolicyDocument": {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Sid": "DenyDirectCodeIamAndKeyPolicyMutation",
                  "Effect": "Deny",
                  "Action": [
                    "lambda:UpdateFunctionCode", "lambda:UpdateFunctionConfiguration", "lambda:DeleteFunction",
                    "lambda:PutFunctionCodeSigningConfig", "lambda:DeleteFunctionCodeSigningConfig", "lambda:PublishVersion",
                    "lambda:CreateAlias", "lambda:UpdateAlias", "lambda:DeleteAlias", "lambda:AddPermission", "lambda:RemovePermission",
                    "lambda:PutFunctionConcurrency", "lambda:DeleteFunctionConcurrency",
                    "lambda:PutFunctionEventInvokeConfig", "lambda:UpdateFunctionEventInvokeConfig", "lambda:DeleteFunctionEventInvokeConfig",
                    "iam:CreateRole", "iam:DeleteRole", "iam:UpdateRole", "iam:UpdateAssumeRolePolicy",
                    "iam:PutRolePolicy", "iam:DeleteRolePolicy", "iam:AttachRolePolicy", "iam:DetachRolePolicy",
                    "iam:TagRole", "iam:UntagRole", "iam:CreatePolicy", "iam:CreatePolicyVersion",
                    "iam:SetDefaultPolicyVersion", "iam:DeletePolicy", "iam:DeletePolicyVersion",
                    "kms:Sign", "kms:CreateGrant", "kms:RetireGrant", "kms:RevokeGrant", "kms:PutKeyPolicy"
                  ],
                  "Resource": "*"
                },
                {
                  "Sid": "DenyRuntimeAssumptionAndDelegation",
                  "Effect": "Deny",
                  "Action": ["sts:AssumeRole", "iam:PassRole"],
                  "Resource": {"Fn::GetAtt": ["RuntimeRole", "Arn"]}
                },
                {
                  "Sid": "DenyAllIndirectStackMutation",
                  "Effect": "Deny",
                  "Action": ["cloudformation:CreateStack", "cloudformation:UpdateStack", "cloudformation:CreateChangeSet", "cloudformation:ExecuteChangeSet"],
                  "Resource": "*"
                }
              ]
            }
          },
          {
            "PolicyName": "inspect-only-separated-roles-and-boundary",
            "PolicyDocument": {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Sid": "InspectOnlyDeclaredRoles",
                  "Effect": "Allow",
                  "Action": ["iam:GetRole", "iam:GetRolePolicy", "iam:ListAttachedRolePolicies", "iam:ListRolePolicies"],
                  "Resource": [
                    {"Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cellos-dev-reference-signed-time-runtime"},
                    {"Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cellos-dev-reference-signed-time-deploy-admin"},
                    {"Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cellos-dev-reference-signed-time-code-sign-approval"},
                    {"Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cellos-dev-reference-signed-time-iam-review"},
                    {"Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cellos-dev-reference-signed-time-key-policy-admin"},
                    {"Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cellos-dev-reference-signed-time-lineage-transition"}
                  ]
                },
                {
                  "Sid": "InspectOnlyExternalBoundary",
                  "Effect": "Allow",
                  "Action": ["iam:GetPolicy", "iam:GetPolicyVersion"],
                  "Resource": {"Ref": "ExternalPermissionsBoundaryArn"}
                }
              ]
            }
          }
        ]
      }
    },
    "KeyPolicyAdminRole": {
      "Type": "AWS::IAM::Role",
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Properties": {
        "RoleName": "cellos-dev-reference-signed-time-key-policy-admin",
        "PermissionsBoundary": {"Ref": "ExternalPermissionsBoundaryArn"},
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [{
            "Sid": "ExactExternalPrincipal",
            "Effect": "Allow",
            "Principal": {"AWS": {"Ref": "KeyPolicyTrustedPrincipalArn"}},
            "Action": "sts:AssumeRole",
            "Condition": {"ArnEquals": {"aws:PrincipalArn": {"Ref": "KeyPolicyTrustedPrincipalArn"}}}
          }]
        },
        "Policies": [{
          "PolicyName": "fail-closed-signing-reachability-guardrails",
          "PolicyDocument": {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Sid": "DenyDirectCodeIamAndSigningMutation",
                "Effect": "Deny",
                "Action": [
                  "lambda:UpdateFunctionCode", "lambda:UpdateFunctionConfiguration", "lambda:DeleteFunction",
                  "lambda:PutFunctionCodeSigningConfig", "lambda:DeleteFunctionCodeSigningConfig", "lambda:PublishVersion",
                  "lambda:CreateAlias", "lambda:UpdateAlias", "lambda:DeleteAlias", "lambda:AddPermission", "lambda:RemovePermission",
                  "lambda:PutFunctionConcurrency", "lambda:DeleteFunctionConcurrency",
                  "lambda:PutFunctionEventInvokeConfig", "lambda:UpdateFunctionEventInvokeConfig", "lambda:DeleteFunctionEventInvokeConfig",
