# cargo-audit configuration (Security Scan CI job, rustsec/audit-check).
# Keep ignore entries in sync with deny.toml [advisories].ignore — cargo-deny
# and cargo-audit both scan the RustSec DB and must agree.

[advisories]
ignore = [
    # ttf-parser unmaintained — no safe upgrade; skrifa migration is a separate task.
    "RUSTSEC-2026-0192",
    # rsa Marvin timing sidechannel — pulled by embedded-tls for TLS cert
    # signature verification only (public-key op). The attack needs a
    # private-key decryption timing oracle Cellos never exposes. No fixed
    # rsa release exists yet.
    "RUSTSEC-2023-0071",
    # crypto-bigint 0.5 (via p256 0.13) is not constant-time. Workspace p256 is
    # verify-only plus ephemeral TLS ECDHE in embedded-tls 0.19 (no p256 0.14
    # release); the long-term signer silo-guest is on the patched line. Same entry
    # and review date (2027-01-31) as deny.toml.
    "RUSTSEC-2026-0387",
    # heapless 0.8.0 unsound advisories: same entries, analysis and review date as
    # deny.toml (unused APIs; panic = "abort" everywhere for 0577).
    "RUSTSEC-2026-0574",
    "RUSTSEC-2026-0575",
    "RUSTSEC-2026-0576",
    "RUSTSEC-2026-0577",
    "RUSTSEC-2026-0578",
    "RUSTSEC-2026-0579",
    "RUSTSEC-2026-0580",
    "RUSTSEC-2026-0581",
    "RUSTSEC-2026-0582",
]
